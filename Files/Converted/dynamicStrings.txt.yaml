  splits:
  - text: "师姐余采薇继续醉心习武，并逐步成为了仙霞派最为锐利之宝剑。"
    translated: "Senior Sister Yu Caiwei continued to be absorbed in martial arts practice and gradually became the sharp sword of the Xianxia Sect."
  - subIndex: 1
    text: "在她锋芒所指之处，群邪避易，妖魔退散，"
    translated: "Wherever her sharp gaze landed, evil forces retreated and demons dispersed."
  - subIndex: 2
    text: "最终她成为了江湖中人人敬仰之女剑侠，"
    translated: "Ultimately, they became a xiuhu girl revered by all in the Jianghu."
  - subIndex: 3
