    translated: "(Take the elixir)"
- raw: "（欢喜）金樽清酒斗十千，玉盘珍羞直万钱。\n若非#SourceInteractName#情高志远，品味不俗，难成此精美绝伦之筵席，佩服佩服。"
  splits:
  - text: "（欢喜）金樽清酒斗十千，玉盘珍羞直万钱。"
    translated: "Joyful in the jade cup, clear wine priced at ten thousand coins a dou, precious dishes on the silver platter valued at ten thousand coins."
  - subIndex: 1
    text: "若非#SourceInteractName#情高志远，品味不俗，难成此精美绝伦之筵席，佩服佩服。"
    translated: "If not for #SourceInteractName# having lofty aspirations and refined tastes, it would be impossible to host this exquisite banquet. Admirable, admirable."
  templates:
  - template: "{0}\n{1}"
- raw: "（清点弟子后）......\n哎呀，看来你我两派中似乎没有符合要求的弟子可供出战，\n看来这切磋比试之事只能就此作罢了。"
  splits:
  - text: "（清点弟子后）......"
    translated: "(after counting the disciples)......"
  - subIndex: 1
    text: "哎呀，看来你我两派中似乎没有符合要求的弟子可供出战，"
    translated: "Oh, it seems neither of our factions has a disciple who meets the requirements for battle."
  - subIndex: 2
    text: "看来这切磋比试之事只能就此作罢了。"
    translated: "It seems we'll have to call it quits on this sparring match."
  templates:
  - template: "{0}\n{1}\n{2}"
- raw: "（满意）食不厌精，烩不厌细，\n多谢#SourceInteractName#慷慨大方，尽地主之谊，方才使得举座皆欢，宾朋尽乐。"
  splits:
  - text: "（满意）食不厌精，烩不厌细，"
    translated: "Satisfy with food that is not overly refined, and prepared with great care."
  - subIndex: 1
    text: "多谢#SourceInteractName#慷慨大方，尽地主之谊，方才使得举座皆欢，宾朋尽乐。"
    translated: "Thank you, #SourceInteractName#, for your generous hospitality, which ensured that everyone present was delighted and that all guests were thoroughly entertained."
