  splits:
  - text: "一路跋涉，你终于找到了迷宫出口。"
    translated: "After a long journey, you finally found the exit of the maze."
- raw: "一路跋涉，你终于来到乱葬荒坟深处，\n没想到坟茔间阴影中，忽有一人暴起发难，抽刀向你袭来，\n竟是一名穷凶极恶的江湖逃犯躲藏在此处。"
  splits:
  - text: "一路跋涉，你终于来到乱葬荒坟深处，"
    translated: "After a long trek, you finally arrive at the deepest part of the desolate graveyard."
  - subIndex: 1
    text: "没想到坟茔间阴影中，忽有一人暴起发难，抽刀向你袭来，"
    translated: "Unexpectedly, someone suddenly leaped out of the shadows among the graves and attacked them with a knife towards them."
  - subIndex: 2
    text: "竟是一名穷凶极恶的江湖逃犯躲藏在此处。"
    translated: "Turns out a notorious criminal from the Jianghu is hiding here."
  templates:
  - template: "{0}\n{1}\n{2}"
- raw: "一路跋涉，你终于来到强盗山寨深处，\n只见强盗头目与几名手下武器在手，怒目圆睁，似乎要将你生吞活剥。"
  splits:
  - text: "一路跋涉，你终于来到强盗山寨深处，"
    translated: "Trudging through the wilderness, you finally arrive at the heart of the bandit stronghold."
  - subIndex: 1
    text: "只见强盗头目与几名手下武器在手，怒目圆睁，似乎要将你生吞活剥。"
    translated: "Only to see the bandit leader and several subordinates holding weapons, eyes bulging with anger, as if they intend to tear you apart alive."
  templates:
  - template: "{0}\n{1}"
- raw: "一路跋涉，你终于来到目的地，并将周边情况记录在案。"
  splits:
  - text: "一路跋涉，你终于来到目的地，并将周边情况记录在案。"
    translated: "After a long journey, you finally arrived at your destination and recorded the surrounding conditions."
- raw: "一路跋涉，你终于来到马贼据点深处，\n只见马贼头目与几名手下将一名武林人士围在中央，正要动手，\n众人见你突然出现，皆是吃了一惊。"
  splits:
  - text: "一路跋涉，你终于来到马贼据点深处，"
    translated: "Trudging on, you finally arrive at the heart of the bandit outpost."
  - subIndex: 1
    text: "只见马贼头目与几名手下将一名武林人士围在中央，正要动手，"
    translated: "Only to see the bandit leader and several subordinates surround a Wulin individual in the center, just about to make a move,"
