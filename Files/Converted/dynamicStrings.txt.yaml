- raw: "这群狗官差平日威风凛凛，仗势欺人，没想到不过是些土鸡瓦犬！\n#SourceInteractName#仗义相助，小的们感激于心，奈何事已至此，官府也不会善罢甘休。\n小的们就此别过，各谋生路去了！"
