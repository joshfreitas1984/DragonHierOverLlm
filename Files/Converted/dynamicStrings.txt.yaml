- raw: "师姐姜婉以先皇公主的身份，帮仙霞派沟通朝廷，号令群雄。\n在她的斡旋之下，仙霞派威望日隆，在朝中支持者也越来越多。\n仙霞派也借助她的身份，在朝堂中扮演着举足轻重的角色。"
  splits:
  - text: "师姐姜婉以先皇公主的身份，帮仙霞派沟通朝廷，号令群雄。"
    translated: "Senior Sister Jiang Wan, using the identity of the former emperor's princess, helped the Xianxia Sect communicate with the court and issue orders to the gathered heroes."
  - subIndex: 1
    text: "在她的斡旋之下，仙霞派威望日隆，在朝中支持者也越来越多。"
    translated: "Under her mediation, the Xianxia Sect's prestige grew steadily, and it gained more supporters in the court."
  - subIndex: 2
    text: "仙霞派也借助她的身份，在朝堂中扮演着举足轻重的角色。"
    translated: "The Xianxia Sect also plays a crucial role in the court due to her identity."
