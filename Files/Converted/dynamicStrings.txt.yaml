    text: "众人见你突然出现，皆是吃了一惊。"
    translated: "Everyone was startled to see you suddenly appear."
  templates:
  - template: "{0}\n{1}\n{2}"
- raw: "一路跋涉，总算收集了此处所有资源，真是收获颇丰。"
