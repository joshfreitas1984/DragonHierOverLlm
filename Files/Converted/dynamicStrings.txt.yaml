- raw: "（你迅速出手，钳制住那毒蛇的三寸，然后将它远远抛开）"
  splits:
  - text: "（你迅速出手，钳制住那毒蛇的三寸，然后将它远远抛开）"
    translated: "(You acted swiftly, restraining the snake's three‑inch section, and then threw it far away)"
- raw: "（你随手扔出一枚石子，正好砸在那毒蛇的面门之上，顿时将它赶走）"
  splits:
  - text: "（你随手扔出一枚石子，正好砸在那毒蛇的面门之上，顿时将它赶走）"
    translated: "They casually threw a stone, which hit the venomous snake in the face and drove it away instantly."
- raw: "（催动轻功一路追赶......）\n这家伙脚力不错，若非我轻功高强恐怕还真追之不及\n看来得因地制宜，想想办法才行！"
  splits:
  - text: "（催动轻功一路追赶......）"
    translated: "(Drive through Qinggong to pursue relentlessly......)"
  - subIndex: 1
    text: "这家伙脚力不错，若非我轻功高强恐怕还真追之不及"
    translated: "This guy has pretty good leg strength. If it weren't for my strong lightness technique, I might not have been able to catch up."
  - subIndex: 2
    text: "看来得因地制宜，想想办法才行！"
    translated: "We need to adapt to the situation and think of a solution!"
  templates:
  - template: "{0}\n{1}\n{2}"
- raw: "（微微一笑，转身离去。渐行渐远之时，却突然转过身来）\n#SourceInteractName#若不嫌弃，明年我们再共度七夕如何？"
  splits:
  - text: "（微微一笑，转身离去。渐行渐远之时，却突然转过身来）"
    translated: "(Slightly smiling, she turned to go. As she was gradually moving farther away, she suddenly turned back.)"
  - subIndex: 1
    text: "#SourceInteractName#若不嫌弃，明年我们再共度七夕如何？"
    translated: "#SourceInteractName#, if you don't mind, how about we spend another Qixi Festival together next year?"
  templates:
  - template: "{0}\n{1}"
- raw: "（抡起铁锤向石板砸去）嚯！哈！嚯！哈！......\n这铁锤好生沉重，震的我筋酸骨麻，几下便将石板敲得粉碎。\n#SourceInteractName#你感觉如何，可需叫大夫前来救治？"
  splits:
  - text: "（抡起铁锤向石板砸去）嚯！哈！嚯！哈！......"
    translated: "Swing the iron hammer and strike the stone slab! Ho! Ha! Ho! Ha! ..."
  - subIndex: 1
    text: "这铁锤好生沉重，震的我筋酸骨麻，几下便将石板敲得粉碎。"
    translated: "This iron hammer is dreadfully heavy; it vibrates through my muscles and bones, and a few strikes shattered the stone slab to pieces."
  - subIndex: 2
    text: "#SourceInteractName#你感觉如何，可需叫大夫前来救治？"
  templates:
  - template: "{0}\n{1}\n{2}"
- raw: "（服下丹药）"
  splits:
