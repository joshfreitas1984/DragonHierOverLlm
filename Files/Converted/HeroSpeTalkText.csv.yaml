    translated: "Only a few people have had the chance to ascend to the rooftop throughout history and ancient times."
  - split: 10
    text: "好勇斗狠，以武相争，那便落了下乘。"
    translated: "Brave in battle and ruthless, resorting to force‑such is a poor choice."
    qcReviewedText: "Brave in battle and ruthless, resorting to force‑such is a poor choice.\\nUsing hidden weapons and poison is the best way to defeat an enemy without a bloody fight."
    qcTranslated: "Bravery and ruthlessness in a fight, relying on martial force, is a low‑grade approach.\\nUsing hidden weapons and poison to harm the enemy, achieving victory without spilling blood, is the supreme method."
