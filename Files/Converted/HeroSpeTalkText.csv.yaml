- raw: "评价武功,......对于习武之道......我不过一知半解而已......,#PlayerName#你这些招式看似精妙，\\n但称得上杀人之法的，却是寥寥无几。,#PlayerName#，你这身形笨重，步伐迟缓，\\n还得多练练轻功才行。,#PlayerName#，老夫观你骨骼精奇，气运不凡。\\n若能韬光养晦，潜心修炼，或许终能成就大业。,#PlayerName#招式之中破绽颇多，\\n若是日后与我交手，可要多加小心了。,#PlayerName#这身功夫循规蹈矩，实在无趣。\\n等老子心情好，哪天指点你几招！,#PlayerName#近来功力突飞猛进，老朽果然没看错人。,#PlayerName#和师傅老人家比，不知武功谁高谁低？\\n......感觉应该还是#PlayerName#厉害些。\\n毕竟师傅白胡子一大把了，老身子骨怕是挨不了几拳。,#PlayerName#武功不俗，确实算得上江湖中难得一见的青年才俊了。,呵呵，#PlayerName#周身破绽颇多，\\n万一哪天你我刀兵相向之时......自会知晓。,#PlayerName#若在武学上有疑惑之处，大可来与我探讨。\\n某定当知无不言，言无不尽。,#PlayerName#招式凌厉，然后劲不足。\\n若能藏锋敛气，内外兼修，便能更上一层楼。"
  splits:
  - text: "评价武功"
    translated: "Assess martial arts skill"
  - split: 1
    text: "......对于习武之道......我不过一知半解而已......"
    translated: "...I only have a half‑understanding of the way of martial arts..."
  - split: 2
    text: "#PlayerName#你这些招式看似精妙，"
    translated: "#PlayerName#, these moves of yours appear quite ingenious,"
  - split: 2
    subIndex: 1
    text: "但称得上杀人之法的，却是寥寥无几。"
    translated: "But methods that could truly be called lethal are few and far between."
  - split: 3
    text: "#PlayerName#，你这身形笨重，步伐迟缓，"
    translated: "#PlayerName#, your movements are slow and cumbersome"
  - split: 3
    subIndex: 1
    text: "还得多练练轻功才行。"
    translated: "One needs to practice lightness more"
  - split: 4
    text: "#PlayerName#，老夫观你骨骼精奇，气运不凡。"
    translated: "#PlayerName#, Old Man I've noticed your bone structure is peculiar and extraordinary, and your life force isremarkable."
  - split: 4
    subIndex: 1
    text: "若能韬光养晦，潜心修炼，或许终能成就大业。"
    translated: "If one can bide their time and focus on cultivation, perhaps they might ultimately achieve great endeavors."
  - split: 5
    text: "#PlayerName#招式之中破绽颇多，"
    translated: "#PlayerName#'s techniques have many flaws"
  - split: 5
    subIndex: 1
    text: "若是日后与我交手，可要多加小心了。"
    translated: "If we meet in battle someday, be sure to be more cautious."
  - split: 6
    text: "#PlayerName#这身功夫循规蹈矩，实在无趣。"
    translated: "#PlayerName#this martial skill follows the rules too closely, truly uninteresting."
  - split: 6
    subIndex: 1
    text: "等老子心情好，哪天指点你几招！"
    translated: "Wait until I'm in a good mood; I'll show you a few moves some day!"
  - split: 7
    text: "#PlayerName#近来功力突飞猛进，老朽果然没看错人。"
    translated: "#PlayerName#has made remarkable progress in his cultivation lately. Old Man truly didn't make a wrong judgment on you."
  - split: 8
    text: "#PlayerName#和师傅老人家比，不知武功谁高谁低？"
    translated: "Compared to Master Senior Citizen, #PlayerName# doesn't know who has higher martial arts skills."
  - split: 8
    subIndex: 1
    text: "......感觉应该还是#PlayerName#厉害些。"
    translated: "...I feel #PlayerName# should still be more powerful."
  - split: 8
    subIndex: 2
    text: "毕竟师傅白胡子一大把了，老身子骨怕是挨不了几拳。"
    translated: "After all, Master has a full head of white hair; his old body probably can't withstand many punches."
  - split: 9
    text: "#PlayerName#武功不俗，确实算得上江湖中难得一见的青年才俊了。"
    translated: "#PlayerName#'s martial arts are not bad. You could indeed be considered a rare talent among the young men in the Jianghu."
  - split: 10
    text: "呵呵，#PlayerName#周身破绽颇多，"
    translated: "Haha, #PlayerName#, you have several weaknesses"
  - split: 10
    subIndex: 1
    text: "万一哪天你我刀兵相向之时......自会知晓。"
    translated: "When we face each other in battle someday... we will know."
  - split: 11
    text: "#PlayerName#若在武学上有疑惑之处，大可来与我探讨。"
    translated: "#PlayerName#, if you have any doubts in martial arts, feel free to come and discuss with me."
  - split: 11
    subIndex: 1
    text: "某定当知无不言，言无不尽。"
    translated: "He will speak his mind fully and without reservation."
  - split: 12
    text: "#PlayerName#招式凌厉，然后劲不足。"
    translated: "#PlayerName#'s attacks were sharp and decisive, but then lacked power."
  - split: 12
    subIndex: 1
    text: "若能藏锋敛气，内外兼修，便能更上一层楼。"
    translated: "While they can hide their sharpness and gather their energy, improving both internally and externally, they can advance to the next level."
