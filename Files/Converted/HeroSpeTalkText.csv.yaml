- raw: "为人处世,......能多愈几例顽疾......多救几条性命......此生便足矣......,吾生也有涯，而武道无涯。\\n以有涯随无涯，又何尝不可！,本姑娘所取的财物，大多来路不干净。\\n此等劫富济贫侠义之举，又怎能算是“偷”呢？,祸兮福之所倚，福兮祸之所伏。\\n避世绝俗，秉持守中之道，方为长久之计。,总有一天......我夏天雄要剿灭仙霞派，重振铁掌帮......以报先师之恩情。,人生在世，就是应当随心所欲，肆意妄为。\\n事事都谨小慎微，岂不是白活一场！,江湖中风浪变换，波云诡谲。\\n唯有隔岸观火，见风使舵，方能立于不败之地。,师傅他总念叨着什么佛家、道家、儒家之争，也不知有什么好争的。\\n大不了开个比武擂台，大家一较高下不就行了。,世人皆以为一入江湖，便能自由自在，随心所欲。\\n却不知这江湖中勾心斗角，人心险恶，比世间只多不少。,窃钩者诛，窃国者侯。\\n什么仁义道德，不过是庸人自扰罢了。,天地有正气，公道在人心。\\n我郭淮能得武林众人厚爱，唯靠“侠义”二字而已。,师傅和师叔为了武当派，日日殚精竭虑。\\n我虽资历尚浅，却也想尽力为他们分忧。"
  splits:
  - text: "为人处世"
    translated: "Mannerly behavior"
  - split: 1
    text: "......能多愈几例顽疾......多救几条性命......此生便足矣......"
    translated: "....cure a few more stubborn diseases....save a few more lives....this life would be sufficient...."
  - split: 2
    text: "吾生也有涯，而武道无涯。"
    translated: "Life is finite, but the martial way is endless."
  - split: 2
    subIndex: 1
    text: "以有涯随无涯，又何尝不可！"
    translated: "To pursue the infinite with finite means‑why not at all!"
  - split: 3
    text: "本姑娘所取的财物，大多来路不干净。"
    translated: "The goods I have acquired are mostly from dubious sources."
  - split: 3
    subIndex: 1
    text: "此等劫富济贫侠义之举，又怎能算是"
    translated: "Such acts of righting wrongs and helping the needy, how can they be considered anything but commendable?"
  - split: 3
    subIndex: 2
    text: "偷"
    translated: "Steal"
  - split: 3
    subIndex: 3
    text: "呢？"
    translated: "?"
  - split: 4
    text: "祸兮福之所倚，福兮祸之所伏。"
    translated: "Misfortune may be an actual blessing in disguise, and a blessing may conceal a potential misfortune."
  - split: 4
    subIndex: 1
    text: "避世绝俗，秉持守中之道，方为长久之计。"
    translated: "While living apart from the world, adhering to the way of maintaining balance, this is a long‑term strategy."
  - split: 5
    text: "总有一天......我夏天雄要剿灭仙霞派，重振铁掌帮......以报先师之恩情。"
    translated: "One day... I, Xiachong, will eradicate the Xianxia Sect and revive the Iron Palm Gang... to repay my mentor's kindness."
  - split: 6
    text: "人生在世，就是应当随心所欲，肆意妄为。"
    translated: "Life in the world is about living freely and doing as one pleases."
  - split: 6
    subIndex: 1
    text: "事事都谨小慎微，岂不是白活一场！"
    translated: "Living so cautiously, isn't that just a wasted life!"
  - split: 7
    text: "江湖中风浪变换，波云诡谲。"
    translated: "The winds and waves of the Jianghu shift unpredictably."
  - split: 7
    subIndex: 1
    text: "唯有隔岸观火，见风使舵，方能立于不败之地。"
    translated: "Only by sitting on the fence and adapting to the wind can one remain invincible."
  - split: 8
    text: "师傅他总念叨着什么佛家、道家、儒家之争，也不知有什么好争的。"
    translated: "Master always talks about the disputes between Buddhism, Daoism, and Confucianism, but I'm not sure what's so contentious about it."
  - split: 8
    subIndex: 1
    text: "大不了开个比武擂台，大家一较高下不就行了。"
    translated: "Why not set up a duel platform and let everyone have a competition?"
  - split: 9
    text: "世人皆以为一入江湖，便能自由自在，随心所欲。"
    translated: "People believe that upon entering the Jianghu, one can enjoy freedom and do as they please."
  - split: 9
    subIndex: 1
    text: "却不知这江湖中勾心斗角，人心险恶，比世间只多不少。"
    translated: "Yet little does he know that in the Jianghu, cunning intrigues and treacherous hearts abound, no less than in the worldly realm."
  - split: 10
    text: "窃钩者诛，窃国者侯。"
    translated: "He who steals a hook is put to death, he who steals a country becomes a lord."
  - split: 10
    subIndex: 1
    text: "什么仁义道德，不过是庸人自扰罢了。"
    translated: "What righteousness and morality, merely bother common people unnecessarily."
  - split: 11
    text: "天地有正气，公道在人心。"
    translated: "Righteous energy fills the universe; justice lies in the hearts of men."
  - split: 11
    subIndex: 1
    text: "我郭淮能得武林众人厚爱，唯靠"
    translated: "I can gain the affection of the Wulin only through"
    flaggedForRetranslation: true
    flaggedMistranslation: "Guo Huai,郭淮,"
  - split: 11
    subIndex: 2
    text: "侠义"
    translated: "Righteous bravery"
  - split: 11
    subIndex: 3
    text: "二字而已。"
    translated: "Just two characters"
  - split: 12
    text: "师傅和师叔为了武当派，日日殚精竭虑。"
    translated: "Master and Master Uncle daily exert themselves for the Wudang Sect."
  - split: 12
    subIndex: 1
    text: "我虽资历尚浅，却也想尽力为他们分忧。"
    translated: "Though I am relatively new, I still wish to do what I can to alleviate their burdens."
