    subIndex: 1
    text: "无名天地之始，有名万物之母。"
    translated: "The nameless is the beginning of heaven and earth; the named is the mother of all things."
  - split: 4
    subIndex: 2
    text: "此两者同出而异名，同谓之玄，玄之又玄，众妙之门。"
    translated: "These two arise from the same source but are called by different names, both known as the Mystic, the Mystic within the Mystic, the gate of all mysteries."
  - split: 5
    text: "画虎画皮难画骨，知人知面不知心。"
    translated: "To paint a tiger is hard; it's even harder to capture its bones. To know a person is to know their face, but not their heart."
    qcReviewedText: "To paint a tiger is hard; it's even harder to capture its bones. To know a person is to know their face, but not their heart.\\nMuch wine and meat brings many brothers, yet in times of need, not a soul is seen?"
    qcTranslated: "To paint a tiger, painting the skin is easy, but painting the bones is hard. To know a person, knowing the face is easy, but knowing the heart is hard.\\nWith wine and meat, many brothers appear; in times of need, not a single one is to be seen?"
