- raw: "日常见面,......#PlayerName#......近来可有受伤......,#PlayerName#，有何贵干？,#PlayerName#，最近可有得手什么好宝物？\\n......你这是什么表情，我、我可没想偷你东西。,天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。\\n便是老夫也算不出，这乱世究竟何时终结......,#PlayerName#前来寻我，想必是有事相求。,废话少说，#PlayerName#找老子所为何事？,呵呵呵呵，#PlayerName#今日前来拜访，老朽恐怕早已猜到了。,这世间有比山上野果更好吃的东西？我可不信！\\n除非#PlayerName#下次带来给我尝尝！,#PlayerName#今日看来颇有雅兴，\\n不然怎会突然想起前来寻我？,#PlayerName#就算有事相求，也得拿出相应价码交换才行。,在下不才，蒙武林同道厚爱，得了这“中原大侠”的名号。\\n每每想来，只觉诚惶诚恐，羞愧莫名。,#PlayerName#又见面了，看来你我也算缘分不浅。"
  splits:
  - text: "日常见面"
    translated: "Daily greeting"
  - split: 1
    text: "......近来可有受伤......"
    translated: "...Have you been injured lately..."
  - split: 2
    text: "#PlayerName#，有何贵干？"
    translated: "What can I do for you, #PlayerName#?"
  - split: 3
    text: "#PlayerName#，最近可有得手什么好宝物？"
    translated: "#PlayerName#, have you come across any good treasures lately?"
  - split: 3
    subIndex: 1
    text: "......你这是什么表情，我、我可没想偷你东西。"
    translated: "...What expression is that? I didn't mean to steal anything from you."
  - split: 4
    text: "天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。"
    translated: "Heaven and Earth are indifferent; they treat all things as straws in a ritual. Saints are also indifferent; they treat the people as straws in a ritual."
  - split: 4
    subIndex: 1
    text: "便是老夫也算不出，这乱世究竟何时终结......"
    translated: "Even I cannot calculate when this chaotic world will end..."
  - split: 5
    text: "#PlayerName#前来寻我，想必是有事相求。"
    translated: "#PlayerName# came to find me, so there must be something you need."
  - split: 6
    text: "废话少说，#PlayerName#找老子所为何事？"
    translated: "Cut the crap, #PlayerName# wants something from me?"
  - split: 7
    text: "呵呵呵呵，#PlayerName#今日前来拜访，老朽恐怕早已猜到了。"
    translated: "Haha, #PlayerName# came to visit today‑I suspect I would have guessed it even without your notice."
  - split: 8
    text: "这世间有比山上野果更好吃的东西？我可不信！"
    translated: "Is there anything better to eat than wild berries on the mountain? I don't believe it!"
  - split: 8
    subIndex: 1
    text: "除非#PlayerName#下次带来给我尝尝！"
    translated: "Unless #PlayerName# brings something for me to try next time!"
  - split: 9
    text: "#PlayerName#今日看来颇有雅兴，"
    translated: "#PlayerName# seems to have quite the appetite for refined pursuits today."
  - split: 9
    subIndex: 1
    text: "不然怎会突然想起前来寻我？"
    translated: "Otherwise, how would he suddenly remember to come find me?"
  - split: 10
    text: "#PlayerName#就算有事相求，也得拿出相应价码交换才行。"
    translated: "#PlayerName#, if you have something to ask for, you still need to offer the proper price in return."
  - split: 11
    text: "在下不才，蒙武林同道厚爱，得了这"
    translated: "I am but an unworthy one, and through the kindness of my Wulin peers, I have been granted this."
  - split: 11
    subIndex: 1
    text: "中原大侠"
    translated: "Great Hero of the Central Plains"
  - split: 11
    subIndex: 2
    text: "的名号。"
    translated: "Name"
  - split: 11
    subIndex: 3
    text: "每每想来，只觉诚惶诚恐，羞愧莫名。"
    translated: "Every time I think about it, I feel genuinely fearful and deeply ashamed."
  - split: 12
    text: "#PlayerName#又见面了，看来你我也算缘分不浅。"
    translated: "#PlayerName# meets again, it seems we have some unspoken connection."
