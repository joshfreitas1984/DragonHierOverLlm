    text: "以暗器毒药伤人，兵不血刃，才是上上之法。"
    translated: "Using hidden weapons and poison is the best way to defeat an enemy without a bloody fight."
  - split: 11
    text: "习武之路罕有捷径，唯稳扎稳打，日夜苦练一途，"
    translated: "The path of martial arts offers no shortcuts; one must steadily and tirelessly train day and night."
    qcReviewedText: "The path of martial arts offers no shortcuts; one must steadily and tirelessly train day and night.\\nOnly by mastering martial arts can one reach the realm of the unvanquished righteous."
    qcTranslated: "The path of martial arts offers few shortcuts; only by training steadily and diligently, day and night, can one walk the righteous path of martial arts and attain the realm where the benevolent are invincible."
