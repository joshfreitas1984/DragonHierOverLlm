- raw: "武学见解,当今世人......越醉心武道......\\n我等医者......越难得空闲......,当今武学，多拘泥于花哨招式与繁复心法。\\n然唯有“杀”者，才是武学至高之道。,闯荡江湖，只要练好轻功就行。\\n想打就打，想走就走，岂不是天下无敌？,海纳百川，有容乃大。\\n习武之道，在于并包兼蓄，融会贯通。,强食弱肉，胜者为王，\\n此乃自然之理，亦是武道之真谛。,武学之道，在于破除常规，别开蹊径。\\n若是一招一式，一板一眼，那可就太过无聊了。,习武之道，玄妙无穷。\\n老朽便是穷尽一生，也只得窥见一角而已。,我久居山林，只略懂些拳脚。\\n#PlayerName#若是得空，定要多教我两招。,大隐阁武学本就奥妙无穷，星辰楼之中更藏有秘籍无数。\\n能够登临楼顶之人，从古至今不过寥寥几人而已。,好勇斗狠，以武相争，那便落了下乘。\\n以暗器毒药伤人，兵不血刃，才是上上之法。,习武之路罕有捷径，唯稳扎稳打，日夜苦练一途，\\n方能踏上武学正道，抵达仁者无敌之境。,太极神功乃武当武学之尊，在江湖中亦是久负盛名。\\n传说大成者可以静制动，以柔克刚，其劲力亦如太极圆转，生生不息。"
  splits:
  - text: "武学见解"
    translated: "Martial insights"
  - split: 1
    text: "当今世人......越醉心武道......"
    translated: "Contemporaries... the more immersed they are in martial arts..."
  - split: 1
    subIndex: 1
    text: "我等医者......越难得空闲......"
    translated: "We who are doctors... find it even harder to be idle..."
  - split: 2
    text: "当今武学，多拘泥于花哨招式与繁复心法。"
    translated: "Today's martial arts often focus on flashy techniques and complex heart methods."
  - split: 2
    subIndex: 1
    text: "然唯有"
    translated: "Only then"
  - split: 2
    subIndex: 2
    text: "杀"
    translated: "Sha"
  - split: 2
    subIndex: 3
    text: "者，才是武学至高之道。"
    translated: "That is the pinnacle of martial arts"
  - split: 3
    text: "闯荡江湖，只要练好轻功就行。"
    translated: "Traverse the Jianghu, you just need to master the lightness."
  - split: 3
    subIndex: 1
    text: "想打就打，想走就走，岂不是天下无敌？"
    translated: "Want to fight, go fight; want to leave, go leave‑aren't you invincible under heaven?"
  - split: 4
    text: "海纳百川，有容乃大。"
    translated: "A sea that embraces hundreds of rivers can be great."
  - split: 4
    subIndex: 1
    text: "习武之道，在于并包兼蓄，融会贯通。"
    translated: "The way of martial arts lies in embracing and incorporating diverse techniques, achieving integration and mastery."
  - split: 5
    text: "强食弱肉，胜者为王，"
    translated: "Survival of the fittest, the victor is king."
  - split: 5
    subIndex: 1
    text: "此乃自然之理，亦是武道之真谛。"
    translated: "This is the natural law, and it is the true essence of martial ways."
  - split: 6
    text: "武学之道，在于破除常规，别开蹊径。"
    translated: "The way of martial arts lies in breaking conventional norms and forging new paths."
  - split: 6
    subIndex: 1
    text: "若是一招一式，一板一眼，那可就太过无聊了。"
    translated: "If every move and step were rigidly precise, it would be far too boring."
  - split: 7
    text: "习武之道，玄妙无穷。"
    translated: "The way of martial arts is infinitely mysterious and profound."
  - split: 7
    subIndex: 1
    text: "老朽便是穷尽一生，也只得窥见一角而已。"
    translated: "I could spend my entire life and still only catch a glimpse of it."
  - split: 8
    text: "我久居山林，只略懂些拳脚。"
    translated: "I have lived in the mountains for so long that I only know some basic fighting skills."
  - split: 8
    subIndex: 1
    text: "若是得空，定要多教我两招。"
    translated: "If you have the time, be sure to teach me a few more techniques."
  - split: 9
    text: "大隐阁武学本就奥妙无穷，星辰楼之中更藏有秘籍无数。"
    translated: "The martial arts of the Great Hidden Pavilion are already profound and mysterious. The Stellar Tower contains countless secret treatises as well."
  - split: 9
    subIndex: 1
    text: "能够登临楼顶之人，从古至今不过寥寥几人而已。"
    translated: "Only a few people have had the chance to ascend to the rooftop throughout history and ancient times."
  - split: 10
    text: "好勇斗狠，以武相争，那便落了下乘。"
    translated: "Brave in battle and ruthless, resorting to force‑such is a poor choice."
  - split: 10
    subIndex: 1
    text: "以暗器毒药伤人，兵不血刃，才是上上之法。"
    translated: "Using hidden weapons and poison is the best way to defeat an enemy without a bloody fight."
  - split: 11
    text: "习武之路罕有捷径，唯稳扎稳打，日夜苦练一途，"
    translated: "The path of martial arts offers no shortcuts; one must steadily and tirelessly train day and night."
  - split: 11
    subIndex: 1
    text: "方能踏上武学正道，抵达仁者无敌之境。"
    translated: "Only by mastering martial arts can one reach the realm of the unvanquished righteous."
  - split: 12
    text: "太极神功乃武当武学之尊，在江湖中亦是久负盛名。"
    translated: "Taiji Divine Skill is the pride of Wudang martial arts and is widely renowned in the Jianghu."
  - split: 12
    subIndex: 1
    text: "传说大成者可以静制动，以柔克刚，其劲力亦如太极圆转，生生不息。"
    translated: "It is said that great accomplished ones can move through stillness and soften to overcome hardness. Their power flows like the taiji circle, ever‑renewing and unending."
