    qcReviewedText: "In today's Jianghu, there are too many pretenders who claim to uphold chivalry.\\nOnly by slaying them all can Senior Achiever realize the domineering ambition to bring peace to the chaotic world."
    qcTranslated: "In today's Jianghu, there are too many pretenders who claim to uphold chivalry.\\nOnly by slaying them all can this old man realize his domineering ambition to quell the chaotic world."
