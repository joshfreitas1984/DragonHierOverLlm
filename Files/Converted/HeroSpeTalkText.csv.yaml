    subIndex: 1
    text: "我等医者......越难得空闲......"
    translated: "We who are doctors... find it even harder to be idle..."
  - split: 2
    text: "当今武学，多拘泥于花哨招式与繁复心法。"
    translated: "Today's martial arts often focus on flashy techniques and complex heart methods."
    qcReviewedText: "Today's martial arts often focus on flashy techniques and complex heart methods.\\nYet only Kill reaches the pinnacle of martial arts."
    qcTranslated: "Today's martial arts often dwell in flashy techniques and complex Heart Methods.\\nYet only the Kill is the supreme path of martial arts."
    qcStatus: Corrected
    qcQualityScore: 60
  - split: 2
    subIndex: 1
    text: "然唯有“杀”者，才是武学至高之道。"
    translated: "Yet only Kill reaches the pinnacle of martial arts."
  - split: 3
    text: "闯荡江湖，只要练好轻功就行。"
    translated: "Traverse the Jianghu, you just need to master the lightness."
    qcReviewedText: "Traverse the Jianghu, you just need to master the lightness.\\nWant to fight, go fight; want to leave, go leave‑aren't you invincible under heaven?"
    qcTranslated: "To roam the Jianghu, you only need to master Qinggong.\\nWant to fight, then fight; want to leave, then leave. Aren't you invincible under heaven?"
    qcStatus: Corrected
    qcQualityScore: 82
