    translated: "Taiji Divine Skill is the pride of Wudang martial arts and is widely renowned in the Jianghu."
    qcReviewedText: "Taiji Divine Skill is the pride of Wudang martial arts and is widely renowned in the Jianghu.\\nIt is said that great accomplished ones can move through stillness and soften to overcome hardness. Their power flows like the taiji circle, ever‑renewing and unending."
    qcTranslated: "Taiji Divine Skill is the supreme achievement of Wudang martial arts and has long been renowned in the Jianghu.\\nIt is said that those who have mastered it can use stillness to control motion, and softness to overcome hardness. Their force circulates like the Taiji, unending and ever‑renewing."
