- raw: "对待仇敌,......若深仇大恨之人罹患重病......又是否应当救其性命......,与老夫为敌之人，唯有赶尽杀绝一途而已。,哼，若是有人敢与我结仇，\\n本姑娘非得把他裤头子都偷过来，方能一解心头之恨。,老夫平日隐居山林，鲜有好友，却也无甚仇敌。\\n至人无己，神人无功，圣人无名，如是而已。,#PlayerName#若敢阻碍我铁掌帮行事，\\n到时可休怪老夫不讲情面。,何人敢与老子为敌，老子定会叫他后悔终生！,明枪易躲，暗箭难防。\\n#PlayerName#行走江湖之时，还是少结些仇家为妙。,峨眉山中有个老猴王，天天撒泼捣乱，破坏田地，\\n实在是本姑娘一生之大敌！,恩怨如棋，不必争一时之得失......\\n唯有精心布局，笑到最后，方才称得上是赢家。,睚眦之怨，亦当百倍奉还。\\n若非如此，他人怎知我计心狂不好招惹？,为一己私仇驱使，只会徒增无谓的杀戮。\\n行走江湖，当以公道大义为重！,自古正邪不两立，惩奸除恶，斩妖伏魔，\\n此乃我武当正道应尽之职责。"
  splits:
  - text: "对待仇敌"
    translated: "Deal with enemies"
  - split: 1
    text: "......若深仇大恨之人罹患重病......又是否应当救其性命......"
    translated: "...If a person with a deep grudge suffers from a serious illness... should we save their life..."
  - split: 2
    text: "与老夫为敌之人，唯有赶尽杀绝一途而已。"
    translated: "Those who oppose me must be utterly exterminated."
  - split: 3
    text: "哼，若是有人敢与我结仇，"
    translated: "Hmph, if anyone dares to make enemies with me,"
  - split: 3
    subIndex: 1
    text: "本姑娘非得把他裤头子都偷过来，方能一解心头之恨。"
    translated: "I have to steal all his underpants to vent my frustration."
  - split: 4
    text: "老夫平日隐居山林，鲜有好友，却也无甚仇敌。"
    translated: "I usually hide in the mountains and forests, rarely having friends but also few enemies."
  - split: 4
    subIndex: 1
    text: "至人无己，神人无功，圣人无名，如是而已。"
    translated: "Sages have no self, spirits accomplish nothing, and sainst have no fame; thus it is."
  - split: 5
    text: "#PlayerName#若敢阻碍我铁掌帮行事，"
    translated: "#PlayerName#, if you dare obstruct the Iron Palm Gang's actions,..."
  - split: 5
    subIndex: 1
    text: "到时可休怪老夫不讲情面。"
    translated: "You can't blame an old man for that."
  - split: 6
    text: "何人敢与老子为敌，老子定会叫他后悔终生！"
    translated: "Who dares to oppose me, Old Man will make him regret for life!"
  - split: 7
    text: "明枪易躲，暗箭难防。"
    translated: "A arrow in the open is easy to dodge, but an ambush is hard to guard against."
  - split: 7
    subIndex: 1
    text: "行走江湖之时，还是少结些仇家为妙。"
    translated: "Travelling through the Jianghu, it's better to make fewer enemies."
  - split: 8
    text: "峨眉山中有个老猴王，天天撒泼捣乱，破坏田地，"
    translated: "In the midst of Mount Emei, there's an old monkey king who wreaks havoc every day, damaging farmland."
  - split: 8
    subIndex: 1
    text: "实在是本姑娘一生之大敌！"
    translated: "Truly this Miss is my greatest enemy in a lifetime!"
  - split: 9
    text: "恩怨如棋，不必争一时之得失......"
    translated: "Grudges are like chess; there's no need to fuss over temporary gains or losses..."
  - split: 9
    subIndex: 1
    text: "唯有精心布局，笑到最后，方才称得上是赢家。"
    translated: "Only by carefully planning and emerging victorious in the end can one truly be considered a winner."
  - split: 10
    text: "睚眦之怨，亦当百倍奉还。"
    translated: "Grudges should be returned a hundredfold"
  - split: 10
    subIndex: 1
    text: "若非如此，他人怎知我计心狂不好招惹？"
    translated: "Otherwise, how would others know that my reckless mind is not easily provoked?"
  - split: 11
    text: "为一己私仇驱使，只会徒增无谓的杀戮。"
    translated: "Driven by personal vendetta, it can only lead to pointless slaughter."
  - split: 11
    subIndex: 1
    text: "行走江湖，当以公道大义为重！"
    translated: "Travelling through the Jianghu, one must prioritize justice and righteousness!"
  - split: 12
    text: "自古正邪不两立，惩奸除恶，斩妖伏魔，"
    translated: "Right and wrong have never coexisted since ancient times. Prosecute evil, eliminate wrongdoing, slay demons, and subdue monsters."
  - split: 12
    subIndex: 1
    text: "此乃我武当正道应尽之职责。"
    translated: "This is the duty we Wu Tang righteous path should fulfill."
