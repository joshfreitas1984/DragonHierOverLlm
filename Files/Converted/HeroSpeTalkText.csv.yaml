  - split: 9
    text: "一上高楼万里愁，蒹葭杨柳似汀洲。"
    translated: "Afar in the tall tower, ten thousand miles of sorrow;  The reeds and willows resemble islets near the shore."
    qcReviewedText: "Afar in the tall tower, ten thousand miles of sorrow;  The reeds and willows resemble islets near the shore.\\nThe clouds rise as the sun sets behind the pagoda, and the wind fills the tower as rain is on its way."
    qcTranslated: "Ascending the high tower, a ten‑thousand‑mile sorrow; \\nReeds and willows resemble the islets of the shore.\\nRiver clouds rise as the sun sinks behind the pavilion, mountain rain is about to come, the wind fills the tower."
    qcStatus: Corrected
    qcQualityScore: 88
  - split: 9
    subIndex: 1
    text: "溪云初起日沉阁，山雨欲来风满楼。"
    translated: "The clouds rise as the sun sets behind the pagoda, and the wind fills the tower as rain is on its way."
  - split: 10
    text: "兵者，诡道也。"
    translated: "A soldier fights not because he values his life but because he values victory."
    qcReviewedText: "A soldier fights not because he values his life but because he values victory.\\nBy being capable yet demonstrating incapability, by using something yet showing as if not using it, by drawing close yet appearing distant, and by being far away yet seeming near.\\nCatch them unprepared, strike when they least expect it. This is a victory in warfare, not to be prematurely disclosed."
    qcTranslated: "War is the way of deception.\\nTherefore, when you can attack, feign inability; when you intend to engage, feign inaction; when you are near, appear far; when you are far, appear near.\\nAttack where they are unprepared, appear where you are not expected. These are the principles of military victory, which must not be revealed in advance."
    qcStatus: Corrected
    flaggedForQcReview: true
    qcQualityScore: 35
  - split: 10
    subIndex: 1
    text: "故能而示之不能，用而示之不用，近而示之远，远而示之近。"
    translated: "By being capable yet demonstrating incapability, by using something yet showing as if not using it, by drawing close yet appearing distant, and by being far away yet seeming near."
  - split: 10
    subIndex: 2
    text: "攻其无备，出其不意。此兵家之胜，不可先传也。"
    translated: "Catch them unprepared, strike when they least expect it. This is a victory in warfare, not to be prematurely disclosed."
  - split: 11
    text: "士卒涂草莽，将军空尔为。乃知兵者是凶器，圣人不得已而用之。"
    translated: "Soldiers lie amidst the grass and weeds, while generals vainly lament. Thus I understand that war is a weapon of evil; sages employ it only out of necessity."
    qcReviewedText: "Soldiers lie amidst the grass and weeds, while generals vainly lament. Thus I understand that war is a weapon of evil; sages employ it only out of necessity."
    qcTranslated: "Soldiers lie amidst the grass and weeds, while generals vainly lament. Thus I understand that war is a weapon of evil; sages employ it only out of necessity."
    qcStatus: Corrected
    qcQualityScore: 95
  - split: 12
    text: "无声无象，全身空透，应物自然，西山悬磬。"
    translated: "Soundless and formless, fully permeating the body, adapting to things naturally, West Mountain Xuanying."
    qcReviewedText: "Soundless and formless, fully permeating the body, adapting to things naturally, West Mountain Xuanying.\\nTiger roars, ape cries, the water clears, and the river calms. All is in harmony, allowing one to fully experience and establish their essence."
    qcTranslated: "Soundless and formless, the body is hollow and transparent, responding to things naturally, like the hanging stone of West Mountain.\\nTiger roars, ape cries, water clears, river calms; turning the seas and rivers upside down, exhausting one's nature and establishing one's fate."
    qcStatus: Corrected
    qcQualityScore: 92
  - split: 12
    subIndex: 1
