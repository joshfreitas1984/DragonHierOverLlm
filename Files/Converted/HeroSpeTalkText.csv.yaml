- raw: "评价江湖,......江湖纷乱......#PlayerName#多加小心......,当今江湖，有太多欺世盗名，妄称侠义之辈。\\n唯有将他们斩杀干净，老夫荡平乱世的霸道才能实现。,别看那些江湖大侠，一个个道貌岸然。\\n私底下杀人放火的事没少干，比本姑娘可坏多了。\\n......#PlayerName#，你不会也是其中之一吧？,当今江湖英雄辈出，豪侠并起，此皆天下大乱所致。\\n圣人不死，大盗不止，唯有守中之道，方能维持时局平衡。,什么名门正派，不过是些沽名钓誉之辈！\\n为达目的不择手段，如此方为大丈夫所为。,当今江湖，不过一群虫豸杂碎！\\n能入老子法眼的，不过寥寥数人而已。,最难测算是人心，便是老朽这“江湖百晓”，怕也难解其分毫。,什么是江湖？为啥要叫江湖？\\n难道那些大侠都是鱼虾转世，喜欢游泳不成......,人在江湖，身不由己。\\n#PlayerName#，或许你我也会有拔剑相向的一天。,循规蹈矩依正道而行者，不过棋子而已。\\n呵呵，而我计心狂，只做那弈棋之人。,哎，这江湖中的奸邪宵小之徒，\\n为何总是除之不尽，杀之不竭......,师傅总说，这江湖中人亦正亦邪，黑白往往并不分明。\\n我却觉得黑便是黑，白便是白，又不是瞎子，岂能看不出来？"
  splits:
  - text: "评价江湖"
    translated: "Rate the Jianghu"
  - split: 1
    text: "......江湖纷乱......#PlayerName#多加小心......"
    translated: "...the Jianghu is in chaos... #PlayerName#, be careful..."
  - split: 2
    text: "当今江湖，有太多欺世盗名，妄称侠义之辈。\\n唯有将他们斩杀干净，老夫荡平乱世的霸道才能实现。"
    translated: "In today's Jianghu, there are too many who deceive the world and falsely claim to uphold chivalry.\\nOnly by thoroughly exterminating them can Elder Pacify achieve his domineering goal of bringing peace to the tumultuous world."
  - split: 3
    text: "别看那些江湖大侠，一个个道貌岸然。\\n私底下杀人放火的事没少干，比本姑娘可坏多了。\\n......#PlayerName#，你不会也是其中之一吧？"
    translated: "Don't look at those so‑called Great Heroes of the Jianghu; they all appear upright and moral.\\nIn private, they've done plenty of murders and arson‑much worse than this Miss!\\n......#PlayerName#, are you one of them too?"
  - split: 4
    text: "当今江湖英雄辈出，豪侠并起，此皆天下大乱所致。\\n圣人不死，大盗不止，唯有守中之道，方能维持时局平衡。"
    translated: "Heroes and martial artists abound in the current Jianghu, all arising from the great chaos of the world.\\nA sage does not perish, nor will great thieves cease. Only the way of adhering to the middle can maintain balance in the times."
  - split: 5
    text: "什么名门正派，不过是些沽名钓誉之辈！\\n为达目的不择手段，如此方为大丈夫所为。"
    translated: "What noble and righteous sects, merely some people seeking fame and reputation!\\nMeans and methods are irrelevant to achieving one's goal; that is what a true man does."
  - split: 6
    text: "当今江湖，不过一群虫豸杂碎！\\n能入老子法眼的，不过寥寥数人而已。"
    translated: "Today's Jianghu is merely a mess of various creatures!\\nOnly a handful of people have caught my Daoist eye."
  - split: 7
    text: "最难测算是人心，便是老朽这“江湖百晓”，怕也难解其分毫。"
    translated: "The hardest thing to measure is the heart, and even this “Jianghu Baxiao” of mine might be difficult to decipher fully."
  - split: 8
    text: "什么是江湖？为啥要叫江湖？\\n难道那些大侠都是鱼虾转世，喜欢游泳不成......"
    translated: "What is the Jianghu? Why call it that?\\nCould those Great Heroes have been reborn as fish and shrimp, liking to swim instead...."
  - split: 9
    text: "人在江湖，身不由己。\\n#PlayerName#，或许你我也会有拔剑相向的一天。"
    translated: "In the Jianghu, one's fate is not their own.\\n#PlayerName#, perhaps you and I might even come to draw our swords against each other someday."
  - split: 10
    text: "循规蹈矩依正道而行者，不过棋子而已。\\n呵呵，而我计心狂，只做那弈棋之人。"
    translated: "Those who follow the rules and walk the righteous path are merely pieces on the chessboard.\\nHaha, while my heart races, I merely play the chessmaster."
  - split: 11
    text: "哎，这江湖中的奸邪宵小之徒，\\n为何总是除之不尽，杀之不竭......"
    translated: "Alas, the villains and scoundrels in this Jianghu.\\nWhy can't they be completely exterminated or endlessly defeated..."
  - split: 12
    text: "师傅总说，这江湖中人亦正亦邪，黑白往往并不分明。\\n我却觉得黑便是黑，白便是白，又不是瞎子，岂能看不出来？"
    translated: "Master always says that in the Jianghu, people can be both right and wrong, with black and white rarely clear‑cut.\\nBut I think black is black, and white is white. Not being blind, how could I not see that?"
