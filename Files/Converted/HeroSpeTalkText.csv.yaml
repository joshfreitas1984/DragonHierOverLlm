- raw: "休闲娱乐,......#PlayerName#......可遇到什么趣事......与我说说......,老夫的刀法，还有太多可精进之处。\\n因此更当争分夺秒，勤学苦练才行。,本姑娘一闲着没事，就想去偷点好东西......\\n#PlayerName#要不要一起？,读万卷书，行万里路，方为修行之道。\\n#PlayerName#闲暇之时，也当多读些经史典籍才是。,若一事不能增进武艺或为本帮谋利，老夫便不会浪费时间。,大碗喝酒，快意恩仇，人生如此，夫复何求！,但凡是这江湖之事，老朽皆算略有耳闻，\\n因此方才得了这“百晓”的名号。,在峨眉山上耍猴子，抓野兔，那可有趣的紧啊！\\n#PlayerName#想试试不？比比咱们谁抓得多！,归墟秘典之核心法门，唯有阁主知晓。\\n如此，方能避免修为不足之人强行修习，走火入魔。,叛出五毒教后，我便一直在寻找天下至毒之法门。\\n却听闻这龙胤归藏功中，或许会有线索......,犬子郭勇锐生性纯良，奈何有些不谙世事。\\n还望#PlayerName#多多提点，莫要让他闯下什么祸端。,师傅总希望我日后能接掌武当派。\\n可如今周遭门派虎视眈眈，奸邪之徒横行于世，\\n此等重任，我怕是万万当不起的。"
