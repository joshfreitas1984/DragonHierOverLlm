  - split: 6
    text: "武学之道，在于破除常规，别开蹊径。"
    translated: "The way of martial arts lies in breaking conventional norms and forging new paths."
    qcReviewedText: "The way of martial arts lies in breaking conventional norms and forging new paths.\\nIf every move and step were rigidly precise, it would be far too boring."
