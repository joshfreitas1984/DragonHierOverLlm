  - split: 7
    text: "唱彻阳关泪未干，功名馀事且加餐。浮天水送无穷树，带雨云埋一半山。"
    translated: "The melody of Yangguan lingers with unshed tears,   Achievements and honors are trivial; feast instead.   Endless trees drift past on waters spanning the sky,   Rain‑cloaked clouds obscure half the mountains."
    qcReviewedText: "The melody of Yangguan lingers with unshed tears,   Achievements and honors are trivial; feast instead.   Endless trees drift past on waters spanning the sky,   Rain‑cloaked clouds obscure half the mountains.\\nAncient sorrows span thousands of tales;   Only partings and reunions bring sighs and smiles. While the river may appear calm, true trials lie in the difficulties of human life, they say."
    qcTranslated: "The Yangguan song ends, yet tears remain unshed;\\nFame is trivial, so eat your fill.\\nWater floats skyward, carrying endless trees;\\nRain‑laden clouds bury half the mountains.\\nAncient and modern sorrows, of a thousand kinds;\\nOnly partings and reunions bring joy and grief.\\nThe river's waves are not yet the worst;\\nTruly, the road through human life is hard."
    qcStatus: Corrected
    qcQualityScore: 75
  - split: 7
    subIndex: 1
    text: "今古恨，几千般，只应离合是悲欢。江头未是风波恶，别有人间行路难。"
    translated: "Ancient sorrows span thousands of tales;   Only partings and reunions bring sighs and smiles. While the river may appear calm, true trials lie in the difficulties of human life, they say."
  - split: 8
    text: "师傅老人家总喜欢念些诗词歌赋，什么之乎者也，着实拗口。"
    translated: "Master elderly folks often like reciting poems and verses, all those 'zhi hu zhe ye', are truly hard to pronounce."
    qcReviewedText: "Master elderly folks often like reciting poems and verses, all those 'zhi hu zhe ye', are truly hard to pronounce.\\nCan't we just talk nicely? #PlayerName#, you must be thinking the same way!"
    qcTranslated: "Master, the old codger, always likes reciting poems and verses, all that 'zhi hu zhe ye' stuff, it's really hard to follow.\\nCan't we just speak normally? #PlayerName#, you must think so too!"
    qcStatus: Corrected
    qcQualityScore: 82
  - split: 8
    subIndex: 1
    text: "好好说话不行吗？#PlayerName#你也是这么想的吧！"
