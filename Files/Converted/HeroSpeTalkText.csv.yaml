- raw: "对待朋友,......我久居深山幽谷之中......像#PlayerName#这样能说上两句话之人......亦是不多......,天下之间，太多蝇营狗苟之辈。\\n人生一世，又能遇上几个倾心相交的英雄豪杰？,#PlayerName#放心，本姑娘一般不偷相熟之人的东西......\\n除非有人惹我不开心了！,君子之交，淡泊如水，\\n志同道合之谊，方能历久弥坚。,哼哼，#PlayerName#若能助铁掌帮一臂之力，\\n我夏天雄自也不会亏待阁下......,行走江湖，老子早已习惯了独来独往。\\n报团取暖，不过是蝼蚁所为。,这些年来，老朽见过太多亲朋反目，手足相残之惨剧。\\n所谓天下熙熙皆为利来，天下攘攘皆为利往，莫不如是。,我朋友大多是些飞禽走兽，山野猴子，\\n#PlayerName#你算第一个初具人形的......这成语是这么用的吧？,缘起相聚，缘散别离，江湖中人身若浮萍，\\n#PlayerName#与我也不过如是。,#PlayerName#若能助一臂之力，我自然不会亏待于你。,兄弟义气，自当肝胆相照，一片赤诚。\\n想必#PlayerName#也如此认为。,只要我等名门大派秉公持正，携手并进，\\n就定能使这天下武林风清气正，海晏河清。\\n不知#PlayerName#是否也这样认为？"
  splits:
  - text: "对待朋友"
    translated: "Treat friends"
  - split: 1
    text: "......我久居深山幽谷之中......像#PlayerName#这样能说上两句话之人......亦是不多......"
    translated: "......I have dwelled in the deep mountains and valleys for so long......Few like #PlayerName# can speak more than a few words......"
  - split: 2
    text: "天下之间，太多蝇营狗苟之辈。"
    flaggedForRetranslation: true
    flaggedMistranslation: "Failed"
  - split: 2
    subIndex: 1
    text: "人生一世，又能遇上几个倾心相交的英雄豪杰？"
    translated: "How many devoted and like‑minded heroes can one encounter in a lifetime?"
  - split: 3
    text: "#PlayerName#放心，本姑娘一般不偷相熟之人的东西......"
    translated: "#PlayerName#, rest assured, I generally don't steal from people I know..."
  - split: 3
    subIndex: 1
    text: "除非有人惹我不开心了！"
    translated: "Unless someone angers me!"
  - split: 4
    text: "君子之交，淡泊如水，"
    translated: "A gentleman's friendship is as tranquil as water."
  - split: 4
    subIndex: 1
    text: "志同道合之谊，方能历久弥坚。"
    translated: "A friendship based on shared ideals will only grow stronger over time."
  - split: 5
    text: "哼哼，#PlayerName#若能助铁掌帮一臂之力，"
    translated: "Hmph. If #PlayerName# can lend a hand to the Iron Palm Gang,"
  - split: 5
    subIndex: 1
    text: "我夏天雄自也不会亏待阁下......"
    translated: "I won't shortchange you in the summer heat either...."
  - split: 6
    text: "行走江湖，老子早已习惯了独来独往。"
    translated: "Traversing the Jianghu, I am accustomed to traveling alone."
  - split: 6
    subIndex: 1
    text: "报团取暖，不过是蝼蚁所为。"
    translated: "Huddling together for warmth is merely something ants do."
  - split: 7
    text: "这些年来，老朽见过太多亲朋反目，手足相残之惨剧。"
    translated: "In all these years, I have witnessed too many tragedies of loved ones turning against each other and brothers tearing each other apart."
  - split: 7
    subIndex: 1
    text: "所谓天下熙熙皆为利来，天下攘攘皆为利往，莫不如是。"
    translated: "As goes the saying, All comers to the world seek profit, and all goers from it seek profit, and so it is with these matters."
  - split: 8
    text: "我朋友大多是些飞禽走兽，山野猴子，"
    translated: "My friends are mostly birds and beasts, mountain monkeys."
  - split: 8
    subIndex: 1
    text: "你算第一个初具人形的......这成语是这么用的吧？"
    translated: "You're the first to take on a human form... Is that how this idiom is supposed to be used?"
  - split: 9
    text: "缘起相聚，缘散别离，江湖中人身若浮萍，"
    translated: "Fate brings us together, fate sends us apart; in the Jianghu, people's lives are like floating weeds."
  - split: 9
    subIndex: 1
    text: "与我也不过如是。"
    translated: "Same goes for me"
  - split: 10
    text: "#PlayerName#若能助一臂之力，我自然不会亏待于你。"
    translated: "#PlayerName#, if I can lend you a hand, I won't treat you shabbily."
  - split: 11
    text: "兄弟义气，自当肝胆相照，一片赤诚。"
    translated: "Brotherly loyalty demands openness and sincerity, a heart as red as one's words."
  - split: 11
    subIndex: 1
    text: "想必#PlayerName#也如此认为。"
    translated: "I'm sure #PlayerName# thinks so too"
  - split: 12
    text: "只要我等名门大派秉公持正，携手并进，"
    translated: "As long as the prestigious sects uphold justice and advance together,"
  - split: 12
    subIndex: 1
    text: "就定能使这天下武林风清气正，海晏河清。"
    translated: "So let us ensure that the Wulin is clear and upright, with a peaceful sea and clean rivers."
  - split: 12
    subIndex: 2
    text: "不知#PlayerName#是否也这样认为？"
    translated: "Unknown if #PlayerName# thinks so as well"
