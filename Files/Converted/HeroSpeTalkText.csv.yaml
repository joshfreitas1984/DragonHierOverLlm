  - split: 9
    text: "大隐阁武学本就奥妙无穷，星辰楼之中更藏有秘籍无数。"
    translated: "The martial arts of the Great Hidden Pavilion are already profound and infinite, and within the Star Tower, there are countless Secret Manuals."
    qcReviewedText: "The martial arts of the Great Hidden Pavilion are already profound and infinite, and within the Star Tower, there are countless Secret Manuals.\\nOnly a few people have had the chance to ascend to the rooftop throughout history and ancient times."
    qcTranslated: "The martial arts of the Great Hidden Pavilion are already profound and inexhaustible, and within the Star Tower, there are countless Secret Manuals.\\nOnly a handful of people have managed to reach the top of the tower from ancient times to the present."
    qcStatus: Corrected
    qcQualityScore: 70
