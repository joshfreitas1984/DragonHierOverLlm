  - split: 4
    text: "海纳百川，有容乃大。"
    translated: "A sea that embraces hundreds of rivers can be great."
    qcReviewedText: "A sea that embraces hundreds of rivers can be great.\\nThe way of martial arts lies in embracing and incorporating diverse techniques, achieving integration and mastery."
    qcTranslated: "A sea that accepts hundreds of rivers is great.\\nThe way of martial arts lies in embracing and incorporating diverse techniques, achieving integration and mastery."
