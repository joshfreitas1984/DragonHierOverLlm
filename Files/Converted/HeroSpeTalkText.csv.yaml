- raw: "思考招式,......#PlayerName#......我此招使得......可有纰漏？,绝顶高手相争之时，唯一目的便是击败对方。\\n无欲无情，全心投入，专注于“杀”这一字便已足够。,#PlayerName#，你不会和那些无趣江湖人士一般，\\n成天只知道习武练功吧！,习武练功，何必拘泥于招式？\\n从心所欲，挥手成招，方为至高之境界。,#PlayerName#，老夫这铁掌帮武功，不知可在仙霞派之上？,老子所习招式，皆是逆势而动，倒转而行。\\n任你大罗金仙，也休想摸清老子的套路。,高手之争，非在一招一式之间，而在于运用之“人”身上。\\n只要时机得当，再弱的招式亦能威力倍增。,听师傅说，出招之法在于随心所欲，无拘无束。\\n若能一呼一吸，收发自然，便也算小半个高手了吧。,道无名阁主功力深不可测，我确实远远不及。\\n不过若论剑招之精妙，或许我能略胜一筹。,哼哼，见过我招式之人大多已经殒命，\\n#PlayerName#还是少好奇些为妙。,江湖偌大，在下远算不上天赋异禀。\\n但若论练功刻苦，恐怕无人能与我相提并论。,我道法修为尚浅，师傅总说我还不懂太极生两仪，两仪生四象，四象生八卦的道理。\\n我只见过母鸡生小鸡，却不知这太极生两仪究竟是怎么个“生”法。"
  splits:
  - text: "思考招式"
    translated: "Think of a technique"
  - split: 1
    text: "......我此招使得......可有纰漏？"
    translated: "...I've executed this move... are there any flaws?"
  - split: 2
    text: "绝顶高手相争之时，唯一目的便是击败对方。"
    translated: "When masters of top‑tier skill contend, their sole purpose is to defeat each other."
  - split: 2
    subIndex: 1
    text: "无欲无情，全心投入，专注于"
    translated: "Without desire or emotion, fully focused and invested."
  - split: 2
    subIndex: 2
    text: "杀"
    translated: "Sha"
  - split: 2
    subIndex: 3
    text: "这一字便已足够。"
    translated: "This single character is enough"
  - split: 3
    text: "#PlayerName#，你不会和那些无趣江湖人士一般，"
    translated: "#PlayerName#, you won't be like those dull Jianghu folk."
  - split: 3
    subIndex: 1
    text: "成天只知道习武练功吧！"
    translated: "Does he only know how to practice martial arts and cultivation all day long!"
  - split: 4
    text: "习武练功，何必拘泥于招式？"
    translated: "Why stick to techniques in martial arts practice?"
  - split: 4
    subIndex: 1
    text: "从心所欲，挥手成招，方为至高之境界。"
    translated: "Free from constraint, gesturing creates technique‑truly the highest realm."
  - split: 5
    text: "#PlayerName#，老夫这铁掌帮武功，不知可在仙霞派之上？"
    translated: "#PlayerName#, let me see if the Iron Palm Gang's martial arts is superior to the Xianxia Sect's."
  - split: 6
    text: "老子所习招式，皆是逆势而动，倒转而行。"
    translated: "The techniques I practice all involve moving against the trend and acting in reverse."
  - split: 6
    subIndex: 1
    text: "任你大罗金仙，也休想摸清老子的套路。"
    translated: "No matter how powerful you are, you still can't figure out my tactics."
  - split: 7
    text: "高手之争，非在一招一式之间，而在于运用之"
    translated: "A contest of mastery lies not in each move and stance, but in the application thereof."
  - split: 7
    subIndex: 1
    text: "人"
    translated: "Ren"
  - split: 7
    subIndex: 2
    text: "身上。"
    translated: "On their person"
  - split: 7
    subIndex: 3
    text: "只要时机得当，再弱的招式亦能威力倍增。"
    translated: "Given the right opportunity, even the weakest technique can become incredibly powerful."
  - split: 8
    text: "听师傅说，出招之法在于随心所欲，无拘无束。"
    translated: "According to Master, the key to making a move lies in doing as one pleases without any restrictions."
  - split: 8
    subIndex: 1
    text: "若能一呼一吸，收发自然，便也算小半个高手了吧。"
    translated: "If one can inhale and exhale naturally, sending and receiving with ease, one could be considered a minor master, right?"
  - split: 9
    text: "道无名阁主功力深不可测，我确实远远不及。"
    translated: "The Dao Wuming Pavilion Master's strength is unfathomable, and I am indeed far from matching it."
  - split: 9
    subIndex: 1
    text: "不过若论剑招之精妙，或许我能略胜一筹。"
    translated: "But if it comes to the elegance of sword techniques, perhaps I could edge out a bit ahead."
  - split: 10
    text: "哼哼，见过我招式之人大多已经殒命，"
    translated: "Hmph. Most who have seen my techniques are already dead."
  - split: 10
    subIndex: 1
    text: "还是少好奇些为妙。"
    translated: "It's better to be less curious"
  - split: 11
    text: "江湖偌大，在下远算不上天赋异禀。"
    translated: "The Jianghu is vast, and I far do not count as having exceptional talent."
  - split: 11
    subIndex: 1
    text: "但若论练功刻苦，恐怕无人能与我相提并论。"
    translated: "But if it comes to diligence in training, I daresay no one can match me."
  - split: 12
    text: "我道法修为尚浅，师傅总说我还不懂太极生两仪，两仪生四象，四象生八卦的道理。"
    translated: "I am still shallow in my Daoist cultivation, and my master always says I don't understand the principle that Taiji gives rise to the Two Instruments, the Two Instruments give rise to the Four Symbols, and the Four Symbols give rise to Bagua."
  - split: 12
    subIndex: 1
    text: "我只见过母鸡生小鸡，却不知这太极生两仪究竟是怎么个"
    translated: "I have only seen hens hatch chicks, but I have no idea how the Taiji gives rise to the Liangyi."
  - split: 12
    subIndex: 2
    text: "生"
    translated: "Sheng"
  - split: 12
    subIndex: 3
    text: "法。"
    translated: "Law"
