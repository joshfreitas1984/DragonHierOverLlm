- raw: "武学见解,当今世人......越醉心武道......\\n我等医者......越难得空闲......,当今武学，多拘泥于花哨招式与繁复心法。\\n然唯有“杀”者，才是武学至高之道。,闯荡江湖，只要练好轻功就行。\\n想打就打，想走就走，岂不是天下无敌？,海纳百川，有容乃大。\\n习武之道，在于并包兼蓄，融会贯通。,强食弱肉，胜者为王，\\n此乃自然之理，亦是武道之真谛。,武学之道，在于破除常规，别开蹊径。\\n若是一招一式，一板一眼，那可就太过无聊了。,习武之道，玄妙无穷。\\n老朽便是穷尽一生，也只得窥见一角而已。,我久居山林，只略懂些拳脚。\\n#PlayerName#若是得空，定要多教我两招。,大隐阁武学本就奥妙无穷，星辰楼之中更藏有秘籍无数。\\n能够登临楼顶之人，从古至今不过寥寥几人而已。,好勇斗狠，以武相争，那便落了下乘。\\n以暗器毒药伤人，兵不血刃，才是上上之法。,习武之路罕有捷径，唯稳扎稳打，日夜苦练一途，\\n方能踏上武学正道，抵达仁者无敌之境。,太极神功乃武当武学之尊，在江湖中亦是久负盛名。\\n传说大成者可以静制动，以柔克刚，其劲力亦如太极圆转，生生不息。"
  splits:
  - text: "武学见解"
    translated: "Martial insights"
    qcReviewedText: "Martial insights"
    qcStatus: Passed
    qcQualityScore: 100
  - split: 1
    text: "当今世人......越醉心武道......"
    translated: "Contemporaries... the more immersed they are in martial arts..."
    qcReviewedText: "Contemporaries... the more immersed they are in martial arts...\\nWe who are doctors... find it even harder to be idle..."
    qcTranslated: "The people of today... the more obsessed they are with martial arts...\\nThe harder it becomes for us healers to find a moment's rest..."
    qcStatus: Corrected
    qcQualityScore: 92
