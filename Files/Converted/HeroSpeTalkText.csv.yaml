- raw: "评价江湖,......江湖纷乱......#PlayerName#多加小心......,当今江湖，有太多欺世盗名，妄称侠义之辈。\\n唯有将他们斩杀干净，老夫荡平乱世的霸道才能实现。,别看那些江湖大侠，一个个道貌岸然。\\n私底下杀人放火的事没少干，比本姑娘可坏多了。\\n......#PlayerName#，你不会也是其中之一吧？,当今江湖英雄辈出，豪侠并起，此皆天下大乱所致。\\n圣人不死，大盗不止，唯有守中之道，方能维持时局平衡。,什么名门正派，不过是些沽名钓誉之辈！\\n为达目的不择手段，如此方为大丈夫所为。,当今江湖，不过一群虫豸杂碎！\\n能入老子法眼的，不过寥寥数人而已。,最难测算是人心，便是老朽这“江湖百晓”，怕也难解其分毫。,什么是江湖？为啥要叫江湖？\\n难道那些大侠都是鱼虾转世，喜欢游泳不成......,人在江湖，身不由己。\\n#PlayerName#，或许你我也会有拔剑相向的一天。,循规蹈矩依正道而行者，不过棋子而已。\\n呵呵，而我计心狂，只做那弈棋之人。,哎，这江湖中的奸邪宵小之徒，\\n为何总是除之不尽，杀之不竭......,师傅总说，这江湖中人亦正亦邪，黑白往往并不分明。\\n我却觉得黑便是黑，白便是白，又不是瞎子，岂能看不出来？"
  splits:
  - text: "评价江湖"
    translated: "Rate the Jianghu"
  - split: 1
    text: "......江湖纷乱......#PlayerName#多加小心......"
    translated: "...the Jianghu is in chaos... #PlayerName#, be careful..."
  - split: 2
    text: "当今江湖，有太多欺世盗名，妄称侠义之辈。"
    translated: "In today's Jianghu, there are too many pretenders who claim to uphold chivalry."
  - split: 2
    subIndex: 1
    text: "唯有将他们斩杀干净，老夫荡平乱世的霸道才能实现。"
    translated: "Only by slaying them all can Senior Achiever realize the domineering ambition to bring peace to the chaotic world."
  - split: 3
    text: "别看那些江湖大侠，一个个道貌岸然。"
    translated: "Don't look at those so‑called great heroes of the Jianghu; they all wear a mask of righteousness."
  - split: 3
    subIndex: 1
    text: "私底下杀人放火的事没少干，比本姑娘可坏多了。"
    translated: "Private killings and arson aren't rare either; I'm much worse than this Miss."
  - split: 3
    subIndex: 2
    text: "，你不会也是其中之一吧？"
    translated: "You're not one of them, right?"
  - split: 4
    text: "当今江湖英雄辈出，豪侠并起，此皆天下大乱所致。"
    translated: "Heroes and chivalrous gentlemen abound in the Jianghu today, all due to great turmoil ravaging the land."
  - split: 4
    subIndex: 1
    text: "圣人不死，大盗不止，唯有守中之道，方能维持时局平衡。"
    translated: "A sage not dying means great thieves will never cease. Only the way of staying true to the middle can maintain the balance of the times."
  - split: 5
    text: "什么名门正派，不过是些沽名钓誉之辈！"
    translated: "What noble and righteous sects, merely some people seeking fame and reputation!"
  - split: 5
    subIndex: 1
    text: "为达目的不择手段，如此方为大丈夫所为。"
    translated: "Means are irrelevant to the end goal‑such actions befit true men."
  - split: 6
    text: "当今江湖，不过一群虫豸杂碎！"
    translated: "Today's Jianghu is but a mix of various insects!"
  - split: 6
    subIndex: 1
    text: "能入老子法眼的，不过寥寥数人而已。"
    translated: "Only a few people have caught my eye."
  - split: 7
    text: "最难测算是人心，便是老朽这"
    translated: "The hardest thing to calculate is human heart, even for an old man like me."
  - split: 7
    subIndex: 1
    text: "江湖百晓"
    translated: "Jianghu Bai Xiao"
  - split: 7
    subIndex: 2
    text: "，怕也难解其分毫。"
    translated: ",It's hard to fully understand their feelings"
  - split: 8
    text: "什么是江湖？为啥要叫江湖？"
    translated: "What is the Jianghu? Why call it that?"
  - split: 8
    subIndex: 1
    text: "难道那些大侠都是鱼虾转世，喜欢游泳不成......"
    translated: "Could those Great Heroes have been reincarnated as fish and shrimp, liking swimming instead...."
  - split: 9
    text: "人在江湖，身不由己。"
    translated: "In the Jianghu, one's actions are not entirely in their own control."
  - split: 9
    subIndex: 1
    text: "，或许你我也会有拔剑相向的一天。"
    translated: "Perhaps we might also come to the point where we draw our swords against each other."
  - split: 10
    text: "循规蹈矩依正道而行者，不过棋子而已。"
    translated: "Those who follow the rules and walk the straight path are merely pieces on the board."
  - split: 10
    subIndex: 1
    text: "呵呵，而我计心狂，只做那弈棋之人。"
    translated: "Haha, while my heart races, I am only the chess player."
  - split: 11
    text: "哎，这江湖中的奸邪宵小之徒，"
    translated: "Ah, the villains and scoundrels in this Jianghu."
  - split: 11
    subIndex: 1
    text: "为何总是除之不尽，杀之不竭......"
    translated: "Why can't we ever fully exterminate or exhaust them..."
  - split: 12
    text: "师傅总说，这江湖中人亦正亦邪，黑白往往并不分明。"
    translated: "The master often says that in the Jianghu, people can be both upright and wicked, and good and evil are not always clear‑cut."
  - split: 12
