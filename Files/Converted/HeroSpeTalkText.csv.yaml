- raw: "诗词歌赋,古人医在心，心正药自真......今人医在手，手滥药不神。\\n我愿天地炉，多衔扁鹊身......自然六合内，少闻贫病人。,千古江山，英雄无觅孙仲谋处。\\n舞榭歌台，风流总被雨打风吹去。\\n斜阳草树，寻常巷陌，人道寄奴曾住。\\n想当年，金戈铁马，气吞万里如虎。,世人结交须黄金，黄金不多交不深。\\n纵令然诺暂相许，终是悠悠行路心。,道可道，非常道；名可名，非常名。\\n无名天地之始，有名万物之母。\\n此两者同出而异名，同谓之玄，玄之又玄，众妙之门。,画虎画皮难画骨，知人知面不知心。\\n有酒有肉多兄弟，急难何曾见一人？,绝情断义，横行无忌。\\n天上地下，唯我独尊！,唱彻阳关泪未干，功名馀事且加餐。浮天水送无穷树，带雨云埋一半山。\\n今古恨，几千般，只应离合是悲欢。江头未是风波恶，别有人间行路难。,师傅老人家总喜欢念些诗词歌赋，什么之乎者也，着实拗口。\\n好好说话不行吗？#PlayerName#你也是这么想的吧！,一上高楼万里愁，蒹葭杨柳似汀洲。\\n溪云初起日沉阁，山雨欲来风满楼。,兵者，诡道也。\\n故能而示之不能，用而示之不用，近而示之远，远而示之近。\\n攻其无备，出其不意。此兵家之胜，不可先传也。,士卒涂草莽，将军空尔为。乃知兵者是凶器，圣人不得已而用之。,无声无象，全身空透，应物自然，西山悬磬。\\n虎吼猿鸣，水清河静，翻汇倒海，尽性立命。"
  splits:
  - text: "诗词歌赋"
    translated: "Poetry and verse"
  - split: 1
    text: "古人医在心，心正药自真......今人医在手，手滥药不神。"
    translated: "Ancients healed with heart; when the heart is upright, medicine naturally works true... Moderns heal with hands; when hands are excessive, medicine fails to work wonders."
  - split: 1
    subIndex: 1
    text: "我愿天地炉，多衔扁鹊身......自然六合内，少闻贫病人。"
    translated: "I wish for the Heavens Furnace to grant me the body of Bianque... May there be fewer poor patients in this world."
  - split: 2
    text: "千古江山，英雄无觅孙仲谋处。"
    translated: "Time‑honored rivers and mountains; where can one find a hero like Sun Zhongmou?"
  - split: 2
    subIndex: 1
    text: "舞榭歌台，风流总被雨打风吹去。"
    translated: "Stage of dancing and singing pavilions; the heroic deeds of the past are all swept away by rain and wind."
  - split: 2
    subIndex: 2
    text: "斜阳草树，寻常巷陌，人道寄奴曾住。"
    translated: "Evening sun shines on grass and trees, ordinary alleys where ancient heroes once lived."
  - split: 2
    subIndex: 3
    text: "想当年，金戈铁马，气吞万里如虎。"
    translated: "Back in the day, golden spears and iron horses, swallowing miles upon miles with the might of tigers."
  - split: 3
    text: "世人结交须黄金，黄金不多交不深。"
    translated: "People form friendships with gold, but if the gold is lacking, so too is the depth of the friendship."
  - split: 3
    subIndex: 1
    text: "纵令然诺暂相许，终是悠悠行路心。"
    translated: "Though we may temporarily make promises, ultimately their hearts remain strangers."
  - split: 4
    text: "道可道，非常道；名可名，非常名。"
    translated: "The Way that can be spoken is not the constant Way; the name that can be named is not the constant name."
  - split: 4
    subIndex: 1
    text: "无名天地之始，有名万物之母。"
    translated: "The nameless is the beginning of heaven and earth; the named is the mother of all things."
  - split: 4
    subIndex: 2
    text: "此两者同出而异名，同谓之玄，玄之又玄，众妙之门。"
    translated: "These two arise from the same source but are called by different names, both known as the Mystic, the Mystic within the Mystic, the gate of all mysteries."
  - split: 5
    text: "画虎画皮难画骨，知人知面不知心。"
    translated: "To paint a tiger is hard; it's even harder to capture its bones. To know a person is to know their face, but not their heart."
  - split: 5
    subIndex: 1
    text: "有酒有肉多兄弟，急难何曾见一人？"
    translated: "Much wine and meat brings many brothers, yet in times of need, not a soul is seen?"
  - split: 6
    text: "绝情断义，横行无忌。"
    translated: "Betraying emotions and morals, acting with impunity"
  - split: 6
    subIndex: 1
    text: "天上地下，唯我独尊！"
    translated: "Above and below, none shall surpass me!"
  - split: 7
    text: "唱彻阳关泪未干，功名馀事且加餐。浮天水送无穷树，带雨云埋一半山。"
    translated: "The melody of Yangguan lingers with unshed tears,   Achievements and honors are trivial; feast instead.   Endless trees drift past on waters spanning the sky,   Rain‑cloaked clouds obscure half the mountains."
  - split: 7
    subIndex: 1
    text: "今古恨，几千般，只应离合是悲欢。江头未是风波恶，别有人间行路难。"
    translated: "Ancient sorrows span thousands of tales;   Only partings and reunions bring sighs and smiles. While the river may appear calm, true trials lie in the difficulties of human life, they say."
  - split: 8
    text: "师傅老人家总喜欢念些诗词歌赋，什么之乎者也，着实拗口。"
    translated: "Master elderly folks often like reciting poems and verses, all those 'zhi hu zhe ye', are truly hard to pronounce."
  - split: 8
    subIndex: 1
    text: "好好说话不行吗？#PlayerName#你也是这么想的吧！"
    translated: "Can't we just talk nicely? #PlayerName#, you must be thinking the same way!"
  - split: 9
    text: "一上高楼万里愁，蒹葭杨柳似汀洲。"
    translated: "Afar in the tall tower, ten thousand miles of sorrow;  The reeds and willows resemble islets near the shore."
  - split: 9
    subIndex: 1
    text: "溪云初起日沉阁，山雨欲来风满楼。"
    translated: "The clouds rise as the sun sets behind the pagoda, and the wind fills the tower as rain is on its way."
  - split: 10
    text: "兵者，诡道也。"
    translated: "A soldier fights not because he values his life but because he values victory."
  - split: 10
    subIndex: 1
    text: "故能而示之不能，用而示之不用，近而示之远，远而示之近。"
    translated: "By being capable yet demonstrating incapability, by using something yet showing as if not using it, by drawing close yet appearing distant, and by being far away yet seeming near."
  - split: 10
    subIndex: 2
    text: "攻其无备，出其不意。此兵家之胜，不可先传也。"
    translated: "Catch them unprepared, strike when they least expect it. This is a victory in warfare, not to be prematurely disclosed."
  - split: 11
    text: "士卒涂草莽，将军空尔为。乃知兵者是凶器，圣人不得已而用之。"
    translated: "Soldiers lie amidst the grass and weeds, while generals vainly lament. Thus I understand that war is a weapon of evil; sages employ it only out of necessity."
  - split: 12
    text: "无声无象，全身空透，应物自然，西山悬磬。"
    translated: "Soundless and formless, fully permeating the body, adapting to things naturally, West Mountain Xuanying."
  - split: 12
    subIndex: 1
    text: "虎吼猿鸣，水清河静，翻汇倒海，尽性立命。"
    translated: "Tiger roars, ape cries, the water clears, and the river calms. All is in harmony, allowing one to fully experience and establish their essence."
