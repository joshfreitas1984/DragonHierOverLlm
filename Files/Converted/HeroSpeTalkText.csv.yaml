- raw: "休闲娱乐,......#PlayerName#......可遇到什么趣事......与我说说......,老夫的刀法，还有太多可精进之处。\\n因此更当争分夺秒，勤学苦练才行。,本姑娘一闲着没事，就想去偷点好东西......\\n#PlayerName#要不要一起？,读万卷书，行万里路，方为修行之道。\\n#PlayerName#闲暇之时，也当多读些经史典籍才是。,若一事不能增进武艺或为本帮谋利，老夫便不会浪费时间。,大碗喝酒，快意恩仇，人生如此，夫复何求！,但凡是这江湖之事，老朽皆算略有耳闻，\\n因此方才得了这“百晓”的名号。,在峨眉山上耍猴子，抓野兔，那可有趣的紧啊！\\n#PlayerName#想试试不？比比咱们谁抓得多！,归墟秘典之核心法门，唯有阁主知晓。\\n如此，方能避免修为不足之人强行修习，走火入魔。,叛出五毒教后，我便一直在寻找天下至毒之法门。\\n却听闻这龙胤归藏功中，或许会有线索......,犬子郭勇锐生性纯良，奈何有些不谙世事。\\n还望#PlayerName#多多提点，莫要让他闯下什么祸端。,师傅总希望我日后能接掌武当派。\\n可如今周遭门派虎视眈眈，奸邪之徒横行于世，\\n此等重任，我怕是万万当不起的。"
  splits:
  - text: "休闲娱乐"
    translated: "Leisure and entertainment"
  - split: 1
    text: "......可遇到什么趣事......与我说说......"
    translated: "...Any fun stories you've had... tell me about them..."
  - split: 2
    text: "老夫的刀法，还有太多可精进之处。"
    translated: "My blade technique still has much room for improvement."
  - split: 2
    subIndex: 1
    text: "因此更当争分夺秒，勤学苦练才行。"
    translated: "Therefore, we must strive to learn diligently and practice hard every second."
  - split: 3
    text: "本姑娘一闲着没事，就想去偷点好东西......"
    translated: "This miss likes to sneak around and steal some nice things whenever I'm idle...."
  - split: 3
    subIndex: 1
    text: "要不要一起？"
    translated: "Want to join?"
  - split: 4
    text: "读万卷书，行万里路，方为修行之道。"
    translated: "Read ten thousand books and travel ten thousand miles to truly master the way of cultivation."
  - split: 4
    subIndex: 1
    text: "闲暇之时，也当多读些经史典籍才是。"
    translated: "In idle moments, one should also read more classics and historical texts."
  - split: 5
    text: "若一事不能增进武艺或为本帮谋利，老夫便不会浪费时间。"
    translated: "If one thing does not improve my martial arts or benefit our faction, Old Man would not waste time on it."
  - split: 6
    text: "大碗喝酒，快意恩仇，人生如此，夫复何求！"
    translated: "Drain the cup to the dregs, revel in revenge and righteousness, such is life; what more could one ask for?"
  - split: 7
    text: "但凡是这江湖之事，老朽皆算略有耳闻，"
    translated: "But regarding matters of the Jianghu, the old man has heard of them all."
  - split: 7
    subIndex: 1
    text: "因此方才得了这"
    translated: "Therefore, I just obtained this"
  - split: 7
    subIndex: 2
    text: "百晓"
    translated: "Hundred Wise"
  - split: 7
    subIndex: 3
    text: "的名号。"
    translated: "Name"
  - split: 8
    text: "在峨眉山上耍猴子，抓野兔，那可有趣的紧啊！"
    translated: "Playing with monkeys and catching wild rabbits on Mount Emei is really fun!"
  - split: 8
    subIndex: 1
    text: "想试试不？比比咱们谁抓得多！"
    translated: "Want to try it out? Let's see who catches more!"
  - split: 9
    text: "归墟秘典之核心法门，唯有阁主知晓。"
    translated: "The core Heart Method of the Secret Scroll of Huayu, known only to the Lord."
  - split: 9
    subIndex: 1
    text: "如此，方能避免修为不足之人强行修习，走火入魔。"
    translated: "This way, those without sufficient cultivation can avoid forcing themselves and going astray."
  - split: 10
    text: "叛出五毒教后，我便一直在寻找天下至毒之法门。"
    translated: "After leaving the Five Poisons Sect, I have been searching for the ultimate toxic martial art in the entire world."
  - split: 10
    subIndex: 1
    text: "却听闻这龙胤归藏功中，或许会有线索......"
    translated: "But I've heard that perhaps there might be clues in the Long Yin Huizang technique..."
  - split: 11
    text: "犬子郭勇锐生性纯良，奈何有些不谙世事。"
    translated: "Guo Yongrui, my son, is inherently kind‑hearted, though he sometimes lacks worldly wisdom."
  - split: 11
    subIndex: 1
    text: "还望#PlayerName#多多提点，莫要让他闯下什么祸端。"
    translated: "I hope you, #PlayerName#, can give him plenty of advice and prevent him from getting into any trouble."
  - split: 12
    text: "师傅总希望我日后能接掌武当派。"
    translated: "The master always hopes that one day I will take over the Wudang Sect."
  - split: 12
    subIndex: 1
    text: "可如今周遭门派虎视眈眈，奸邪之徒横行于世，"
    translated: "But now, surrounding sects are eyeing with ambition, while wicked people roam the world."
  - split: 12
    subIndex: 2
    text: "此等重任，我怕是万万当不起的。"
    translated: "Such great responsibility, I fear I am utterly unworthy of bearing it."
