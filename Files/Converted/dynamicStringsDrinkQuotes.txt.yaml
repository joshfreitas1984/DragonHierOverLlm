- raw: "天子呼来不上船"
  splits:
  - text: "天子呼来不上船"
    translated: "The emperor calls, but he refuses to come."
- raw: "自称臣是酒中仙"
  splits:
  - text: "自称臣是酒中仙"
    translated: "I call myself Wine Immortal"
- raw: "举杯消愁愁更愁"
  splits:
  - text: "举杯消愁愁更愁"
    translated: "Raise a glass to dispel sorrow, only to meet it with more."
- raw: "对饮成三人"
  splits:
  - text: "对饮成三人"
    translated: "Drinking together, making us three"
- raw: "两人对酌山花开"
  splits:
  - text: "两人对酌山花开"
    translated: "The two of them drank wine amid the blooming mountain flowers."
- raw: "一杯一杯复一杯"
  splits:
  - text: "一杯一杯复一杯"
    translated: "Cup after cup after cup"
- raw: "满堂花醉三千客"
  splits:
  - text: "满堂花醉三千客"
    translated: "All guests are intoxicated by the flowers in the hall"
- raw: "一剑霜寒十四州"
  splits:
  - text: "一剑霜寒十四州"
    translated: "A single sword chill fourteen states"
- raw: "举世皆浊我独清"
  splits:
  - text: "举世皆浊我独清"
    translated: "The world is muddied, yet I alone am clear."
- raw: "众人皆醉我独醒"
  splits:
  - text: "众人皆醉我独醒"
    translated: "While all are drunk, I alone am sober."
- raw: "想当年金戈铁马"
  splits:
  - text: "想当年金戈铁马"
    translated: "Back in the day, golden spears and iron horses"
- raw: "气吞万里如虎"
  splits:
  - text: "气吞万里如虎"
    translated: "Swallow the myriarch like a tiger"
- raw: "何以解忧"
  splits:
  - text: "何以解忧"
    translated: "How to soothe worry"
- raw: "唯有杜康"
  splits:
  - text: "唯有杜康"
    translated: "Only Gu Kaizhi"
- raw: "对酒当歌"
  splits:
  - text: "对酒当歌"
    translated: "Drink to one's health and sing"
- raw: "人生几何"
  splits:
  - text: "人生几何"
    translated: "How short life is"
- raw: "酒入愁肠"
  splits:
  - text: "酒入愁肠"
    translated: "Alcohol fuels sorrow in the gut"
- raw: "化作相思泪"
  splits:
  - text: "化作相思泪"
    translated: "Turned to tears of longing"
- raw: "浊酒一杯家万里"
  splits:
  - text: "浊酒一杯家万里"
    translated: "A cup of turbid wine, homesick for ten thousand miles"
- raw: "燕然未勒归无计"
  splits:
  - text: "燕然未勒归无计"
    translated: "There's no accounting for return when Yanran remains unconquered."
- raw: "桃李春风一杯酒"
  splits:
  - text: "桃李春风一杯酒"
    translated: "A cup of wine in the spring breeze under the peach and plum blossoms"
- raw: "江湖夜雨十年灯"
  splits:
  - text: "江湖夜雨十年灯"
    translated: "Jianghu night rain ten years of lamp"
