    translated: "On 1 Month 15 Day, it is the first full moon night of the year, and major cities are decked out with decorations, hosting lantern festivals, riddle guessing, mooncake eating, and fish and dragon dance performances."
- raw: "3月上旬清明节既是节气，又是节日。正值春季气清景明，万物萌发，生机勃勃，也是民众扫墓祭祖，追怀先人的节日。"
  splits:
