    translated: "The eighth day of the twelfth lunar month marks the day Shakyamuni attained enlightenment and became a Buddha. Families commemorate it by simmering a rich, sweet Laba porridge made from various grains and beans, mixed with dried fruits and nuts such as red dates, peanuts, lotus seeds, goji berries, longan, and walnuts, sweetened with brown and white sugar."
- raw: "1月15日乃是一年中首个月圆之夜，各大城市皆会张灯结彩，举办赏花灯、猜灯谜、吃汤圆、舞鱼龙等活动。"
  splits:
