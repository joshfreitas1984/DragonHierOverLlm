    translated: "7 April 7 is traditionally said to be the day when the Cowherd and Weaver Girl meet on the Magpie Bridge, making it also a romantic festival to visit one's beloved. Major towns hold events such as the Thread‑Piercing Festival and worship ceremonies to honor the Weaver Girl in celebration."
