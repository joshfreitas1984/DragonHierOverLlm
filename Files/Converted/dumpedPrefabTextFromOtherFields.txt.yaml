    translated: "The number nine is yi zhi shu, meaning the number of yang. The day they refer to as 9 Month 9 Day is a double yang number, making it a fortunate day for renewal. On this day, people carry the elderly and the young to climb heights to admire the autumn, and offer sacrifices to deities and ancestors to celebrate."
