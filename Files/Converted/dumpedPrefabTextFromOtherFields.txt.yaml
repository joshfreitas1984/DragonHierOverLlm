- raw: "每年5月5日，乃是由上古祭龙演变而来的节日。仲夏端午之时苍龙七宿处在全年最中正之位，乃易经飞龙在天之吉日，各大城市会会为此举办盛大的赛马活动。"
  splits:
  - text: "每年5月5日，乃是由上古祭龙演变而来的节日。仲夏端午之时苍龙七宿处在全年最中正之位，乃易经飞龙在天之吉日，各大城市会会为此举办盛大的赛马活动。"
    translated: "Every June 5 day, this festival originated from ancient dragon worship ceremonies. During the Midsummer Dragon Boat Festival, the Seven Stars of the Azure Dragon are in the most upright position of the year, making it a favorable day as described in the I Ching's The Dragon Soars. Major cities host grand horse racing events on 5."
- raw: "每年8月15秋高气爽之时，是祭祀月亮的重大节日。以月之圆满预示人之团圆，亲朋好友为此欢聚一堂，共同赏月吃月饼作为庆祝。"
