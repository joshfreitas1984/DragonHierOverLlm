    translated: "The Qingming Festival falls in early March. It is both a solar term and a traditional festival. As spring brings clear skies and bright scenery, all things begin to sprout and thrive. It is also a time for people to tend to ancestral graves, make offerings to their ancestors, and commemorate those who came before them."
- raw: "7月初7传说是牛郎织女鹊桥相会之日，因此也是探访心仪之人的浪漫节日。各大城镇也会举办穿针乞巧，拜祭织女等活动以示庆祝。"
