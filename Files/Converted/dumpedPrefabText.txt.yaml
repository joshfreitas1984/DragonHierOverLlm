- raw: "♦从气海出发，一路打通穴位。\\n♦最终回归气海，便可打通周天获取额外经验。\\n♦中途内力耗尽，修炼会自动结束，也可点击按钮主动结束。"
  splits:
  - text: "从气海出发，一路打通穴位。"
    translated: "Starting from the Sea of Qi, they smoothly unblocked the meridians."
  - subIndex: 1
    text: "最终回归气海，便可打通周天获取额外经验。"
    translated: "Return to the Qi Sea and you can unlock additional experience throughout the body."
  - subIndex: 2
    text: "中途内力耗尽，修炼会自动结束，也可点击按钮主动结束。"
    translated: "Midway through cultivation, inner power will deplete automatically, ending the session. You can also click the button to end it manually."
  templates:
  - template: "♦{0}\\n♦{1}\\n♦{2}"
- raw: "♦使用头盔/护甲/足履对机关兽进行改装，可获得对所有机关兽生效的特殊加成，持续30日。\\n♦每次改装都会提升对应部位的经验，部位升级后会提供永久的机关兽加成。"
  splits:
  - text: "使用头盔"
    translated: "Use the helmet"
  - subIndex: 1
    text: "护甲"
    translated: "Armor"
  - subIndex: 2
    text: "足履对机关兽进行改装，可获得对所有机关兽生效的特殊加成，持续30日。"
    translated: "Step the Mechanism Beast to modify it, and you will gain special bonuses applicable to all Mechanism Beasts for 30 days."
  - subIndex: 3
    text: "每次改装都会提升对应部位的经验，部位升级后会提供永久的机关兽加成。"
    translated: "Each modification will increase the experience of the corresponding body part. After upgrading a body part, it will provide permanent enhancements to the mecha beast."
  templates:
  - template: "♦{0}/{1}/{2}\\n♦{3}"
- raw: "♦在物品上下毒，当物品转移至他人身上时，就会使其中毒。\\n♦使用带毒装备，阅读带毒书籍等，会导致额外中毒。\\n♦服用带毒的丹药和饮食，会导致中毒加倍。"
  splits:
  - text: "在物品上下毒，当物品转移至他人身上时，就会使其中毒。"
    translated: "To poison an item, when it is transferred to someone else, they will be poisoned."
  - subIndex: 1
    text: "使用带毒装备，阅读带毒书籍等，会导致额外中毒。"
    translated: "Using poison‑equipped items or reading poison‑contaminated books can cause additional poisoning."
  - subIndex: 2
    text: "服用带毒的丹药和饮食，会导致中毒加倍。"
    translated: "Taking toxic elixirs and consuming poisonous food will result in double poisoning."
  templates:
