    text: "历史悠久的皇家祭祀园林，其规模宏伟，由诸多祠堂，亭台，庙宇，楼阁及造景构成。历代皇帝皆会在此例行祭祀，本朝更是不断兴修亭台，扩建园林，以壮其威仪。"
    translated: "A historically renowned imperial sacrificial garden, its grand scale comprises numerous temples, pavilions, shrines, towers, and landscaping features. Rulers of past dynasties regularly conducted sacrifices here, and during our reign, more pavilions were constructed and the garden expanded to enhance its majesty."
  templates:
