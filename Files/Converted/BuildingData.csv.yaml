    translated: "Fortifications built along the mountains, composed of long ramparts, watchtowers, gate forts, and encampment cities. They were designed to block the invasion of northern nomadic cavalry with their iron hooves, making this a battleground coveted by military strategists throughout history. Temporarily, it also became a hub for the gathering and trading of weapons and armor."
  templates:
  - split: 7
    template: "{0}--ShowBuildingShop"
- raw: "47,晋祠,47,6,1,0,4,布施--SpeReduceBadFame,全域民心+1;威望+10;木料+100,粮食-200,技艺经验0.1;弟子功绩0.1,,银钱1000;木料2000,20,5,,1,footstep,0;0,历史悠久的皇家祭祀园林，其规模宏伟，由诸多祠堂，亭台，庙宇，楼阁及造景构成。历代皇帝皆会在此例行祭祀，本朝更是不断兴修亭台，扩建园林，以壮其威仪。"
  splits:
