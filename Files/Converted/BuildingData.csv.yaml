  - split: 19
    text: "由星罗棋布，错综复杂的引水渠道和大小水库组成的庞大水利工程，其渠可行舟，亦可作浇灌汲饮之用，蜀中以此灌溉沃野千里，并罕有水灾泛滥，终成其“天府”之美名。"
    translated: "A vast water engineering project consisting of intricate and numerous irrigation canals and reservoirs supports the fertile fields of Shu. These canals serve not only as passageways for boats but also for irrigation and drinking. Thanks to this system, Shu enjoys rare occurrences of floods and earns its reputation as the Land of Abundance."
  templates:
