- raw: "50,黄鹤楼,50,6,1,0,4,招贤--SpeHireFollower,威望+10;全域治安+1,木料-150,实战经验0.1;弟子功绩0.2,,粮食1000;木料2000,20,8,,2,footstep,0;0,上倚河汉，下临江流，重檐叠翼，巍峨耸峙，传说费祎登仙尝驾黄鹤憩于此，远眺烟波江上，孤帆远影，堪称荆吴景胜之最。名士高人，青年才俊，亦多在此游历交友，切磋技艺。"
  splits:
  - split: 7
    text: "招贤"
    translated: "Recruit Talent"
  - split: 19
    text: "上倚河汉，下临江流，重檐叠翼，巍峨耸峙，传说费祎登仙尝驾黄鹤憩于此，远眺烟波江上，孤帆远影，堪称荆吴景胜之最。名士高人，青年才俊，亦多在此游历交友，切磋技艺。"
    translated: "Reposing above the Milky Way, they overlook the flowing river. Multiple eaves and layered wings, towering and majestic, legend says Fei Yi ascended to immortality and rode a yellow crane to rest here. Gazing afar at the misty and boundless expanse of water, solitary sails fade into the distance‑truly the finest scenery of Jing and Wu regions. Notable figures, talented young men frequently travel and socialize here, refining their skills."
  templates:
