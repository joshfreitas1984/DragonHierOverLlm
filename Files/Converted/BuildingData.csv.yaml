    template: "{0}--SpeReduceBadFame"
- raw: "48,都江堰,48,6,1,0,4,珍馐--ShowBuildingShop,粮食+300,木料-50;矿石-150,资源点产量0.1;科研效率0.4,,粮食2000;木料1000,20,6,2000-15-1-2,1,footstep,0;0,由星罗棋布，错综复杂的引水渠道和大小水库组成的庞大水利工程，其渠可行舟，亦可作浇灌汲饮之用，蜀中以此灌溉沃野千里，并罕有水灾泛滥，终成其“天府”之美名。"
  splits:
