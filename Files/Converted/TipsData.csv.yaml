- raw: "Tips"
- raw: "随身携带的珍宝，\\n若学识足够会每日自动尝试鉴定。"
  splits:
  - text: "随身携带的珍宝，"
    translated: "Treasure always at hand,"
  - subIndex: 1
    text: "若学识足够会每日自动尝试鉴定。"
    translated: "If learned enough, it will attempt identification automatically every day."
  templates:
  - template: "{0}\\n{1}"
- raw: "珍宝在鉴定后才能卖出更高价格。"
  splits:
  - text: "珍宝在鉴定后才能卖出更高价格。"
    translated: "Treasures can only fetch higher prices after appraisal."
- raw: "声望达到对方一半才能结识。"
  splits:
  - text: "声望达到对方一半才能结识。"
    translated: "You must have reputation equal to half of the other party's before you can be acquainted."
- raw: "门派的占领区域达到上限后，\\n就无法占领新的区域。"
  splits:
  - text: "门派的占领区域达到上限后，"
    translated: "After the occupation area of the Sect reaches its limit,"
  - subIndex: 1
    text: "就无法占领新的区域。"
    translated: "Thus, new areas cannot be conquered"
  templates:
  - template: "{0}\\n{1}"
- raw: "门派的弟子人口达到上限后，\\n就无法招募新的弟子。"
  splits:
  - text: "门派的弟子人口达到上限后，"
    translated: "When the disciples' population of the Sect reaches its limit,"
  - subIndex: 1
    text: "就无法招募新的弟子。"
    translated: "So you can no longer recruit new disciples."
  templates:
  - template: "{0}\\n{1}"
- raw: "每一级别的武功都有修习数量上限，\\n超出上限后所有该级别武功获得的经验都会减少。"
  splits:
  - text: "每一级别的武功都有修习数量上限，"
    translated: "Each martial arts skill has a maximum number of points that can be invested at each level."
  - subIndex: 1
    text: "超出上限后所有该级别武功获得的经验都会减少。"
    translated: "After exceeding the limit, all experience gained for that level of martial arts skill will be reduced."
  templates:
  - template: "{0}\\n{1}"
- raw: "装备负重会影响角色在战斗中的速度。"
  splits:
  - text: "装备负重会影响角色在战斗中的速度。"
    translated: "Equipping weight will affect the character's speed in battle."
- raw: "成为掌门后，可以在京城皇宫获取御赐勋阶。"
  splits:
  - text: "成为掌门后，可以在京城皇宫获取御赐勋阶。"
    translated: "Becoming the Sect Leader allows you to obtain imperial granted titles in the capital palace."
- raw: "在官府获取官职后，便可以替朝廷效力。"
  splits:
  - text: "在官府获取官职后，便可以替朝廷效力。"
    translated: "After obtaining a position in the government, one can serve the court."
- raw: "野外有时会出现强力恶贼，\\n此时应绕道而行，以免遭到袭击。"
  splits:
  - text: "野外有时会出现强力恶贼，"
    translated: "Occasionally, powerful bandits appear in the wilderness"
  - subIndex: 1
    text: "此时应绕道而行，以免遭到袭击。"
    translated: "We should take a detour to avoid an attack."
  templates:
  - template: "{0}\\n{1}"
- raw: "探索起始时，偶尔会察觉到高人气息。\\n此时若仔细搜寻，定会有意外收获。"
  splits:
  - text: "探索起始时，偶尔会察觉到高人气息。"
    translated: "At the beginning of exploration, one would occasionally sense the presence of someone skilled or accomplished."
  - subIndex: 1
    text: "此时若仔细搜寻，定会有意外收获。"
    translated: "If you search carefully now, you are sure to find some unexpected treasures."
  templates:
  - template: "{0}\\n{1}"
- raw: "秘籍品质越高，阅读中越容易出现较好的方格。"
  splits:
  - text: "秘籍品质越高，阅读中越容易出现较好的方格。"
    translated: "The higher the quality of the secret technique, the more likely it is to have better cells while reading."
- raw: "放在藏经阁内的秘籍会根据品质，\\n提升全门派修习该武学的速度。"
  splits:
  - text: "放在藏经阁内的秘籍会根据品质，"
    translated: "Placed in the Scripture Pavilion, the manuals will be ranked according to their quality,"
  - subIndex: 1
    text: "提升全门派修习该武学的速度。"
    translated: "Increase the speed at which all sects practice this martial art."
  templates:
  - template: "{0}\\n{1}"
- raw: "好感达到50后可以成为朋友。"
  splits:
  - text: "好感达到50后可以成为朋友。"
    translated: "After reaching 50 goodwill, they can become friends."
- raw: "好感达到100后，可以让关系更进一步。"
  splits:
  - text: "好感达到100后，可以让关系更进一步。"
    translated: "After goodwill reaches 100, you can take the relationship to the next level."
- raw: "恶名过高时进入城镇，\\n很可能会被官府或城内侠士抓捕。"
  splits:
  - text: "恶名过高时进入城镇，"
    translated: "Enter the town when your reputation is too low."
  - subIndex: 1
    text: "很可能会被官府或城内侠士抓捕。"
    translated: "You are very likely to be caught by the authorities or the martial artists within the city."
  templates:
  - template: "{0}\\n{1}"
- raw: "行囊超重会减慢你的大地图旅行速度。"
  splits:
  - text: "行囊超重会减慢你的大地图旅行速度。"
    translated: "Excess luggage will slow down your travel speed on the world map."
- raw: "穿着过于沉重的装备会减慢你的战斗速度。"
  splits:
  - text: "穿着过于沉重的装备会减慢你的战斗速度。"
    translated: "Wearing overly heavy equipment will slow down your combat speed."
- raw: "在编纂秘籍时，\\n你可以将两本低品质秘籍合成一本高品质秘籍。"
  splits:
  - text: "在编纂秘籍时，"
    translated: "While compiling the tome,"
  - subIndex: 1
    text: "你可以将两本低品质秘籍合成一本高品质秘籍。"
    translated: "You can combine two low‑quality scrolls to create one high‑quality scroll."
  templates:
  - template: "{0}\\n{1}"
- raw: "与对方的性格越接近，好感提升越快。"
  splits:
  - text: "与对方的性格越接近，好感提升越快。"
    translated: "The closer your personality matches theirs, the faster your liking towards each other will increase."
- raw: "与对方的立场越接近，初始好感越高。"
  splits:
  - text: "与对方的立场越接近，初始好感越高。"
    translated: "The higher the initial affinity starts at if your stance aligns more closely with the other party."
- raw: "较高的恶名会降低好感获取，\\n其他侠士在野外遭遇时也会避而远之。"
  splits:
  - text: "较高的恶名会降低好感获取，"
    translated: "Higher notoriety reduces reputation gain"
  - subIndex: 1
    text: "其他侠士在野外遭遇时也会避而远之。"
    translated: "While correcting, they encounter other xia Shi in the wild and also avoid them."
  templates:
  - template: "{0}\\n{1}"
- raw: "袭击同门或亲朋好友，\\n会导致恶名成倍增加。"
  splits:
  - text: "袭击同门或亲朋好友，"
    translated: "Attack fellow disciples or kin and friends,"
  - subIndex: 1
    text: "会导致恶名成倍增加。"
    translated: "Will result in reputation points multiplying"
  templates:
  - template: "{0}\\n{1}"
- raw: "恶名每个月会自动衰减10%，\\n投案自首时也会减少10%。"
  splits:
  - text: "恶名每个月会自动衰减10%，"
    translated: "Reputation will automatically decrease by 10% each month."
  - subIndex: 1
    text: "投案自首时也会减少10%。"
    translated: "Confessing and turning yourself in will also reduce it by 10%."
  templates:
  - template: "{0}\\n{1}"
- raw: "在城镇或安全区内行凶作恶，\\n会导致恶名成倍增加。"
  splits:
  - text: "在城镇或安全区内行凶作恶，"
    translated: "Committing crimes in towns or safe zones,"
  - subIndex: 1
    text: "会导致恶名成倍增加。"
    translated: "Will result in reputation points multiplying"
  templates:
  - template: "{0}\\n{1}"
- raw: "探索耐力耗尽后，\\n每走一步都会消耗越来越多生命/内力。"
  splits:
  - text: "探索耐力耗尽后，"
    translated: "After exploring until endurance runs out,"
  - subIndex: 1
    text: "每走一步都会消耗越来越多生命"
    translated: "Every step consumes more and more health"
  - subIndex: 2
    text: "内力。"
    translated: "Inner Power"
  templates:
  - template: "{0}\\n{1}/{2}"
- raw: "战斗中某项伤势较高时，\\n会获得针对该伤势的临时抗性。"
  splits:
  - text: "战斗中某项伤势较高时，"
    translated: "When damage in battle is particularly high,"
  - subIndex: 1
    text: "会获得针对该伤势的临时抗性。"
    translated: "You will gain temporary resistance to that injury."
  templates:
  - template: "{0}\\n{1}"
- raw: "战斗中一名角色败退时，\\n其所控制的机关兽也都会败退。"
  splits:
  - text: "战斗中一名角色败退时，"
    translated: "When a character retreats during battle,"
  - subIndex: 1
    text: "其所控制的机关兽也都会败退。"
    translated: "The mechanism beasts it controls will also retreat."
  templates:
  - template: "{0}\\n{1}"
- raw: "在西域灵州的莫高窟中，\\n可闭关遗忘已有的零级武学或天赋。"
  splits:
  - text: "在西域灵州的莫高窟中，"
    translated: "In the Mogao Caves of Lingzhou in the Western Regions,"
  - subIndex: 1
    text: "可闭关遗忘已有的零级武学或天赋。"
    translated: "You can enter seclusion to forget your existing first‑tier martial arts or talents."
  templates:
  - template: "{0}\\n{1}"
- raw: "外功武学的突破效果，\\n只有在使用该武学时才会生效。"
  splits:
  - text: "外功武学的突破效果，"
    translated: "The breakthrough effect of External Skill martial arts,"
  - subIndex: 1
    text: "只有在使用该武学时才会生效。"
    translated: "It only takes effect when using this martial art."
  templates:
  - template: "{0}\\n{1}"
- raw: "京城的私宅因为等级最高，\\n价格自然也最贵。"
  splits:
  - text: "京城的私宅因为等级最高，"
    translated: "The private residences in the Capital, being of the highest rank,"
  - subIndex: 1
    text: "价格自然也最贵。"
    translated: "The price is naturally also the highest"
  templates:
  - template: "{0}\\n{1}"
- raw: "战场局势瞬息万变，\\n对付实力较弱者也不可掉以轻心。"
  splits:
  - text: "战场局势瞬息万变，"
    translated: "Battlefield situation changes rapidly"
  - subIndex: 1
    text: "对付实力较弱者也不可掉以轻心。"
    translated: "Do not underestimate those who are less powerful."
  templates:
  - template: "{0}\\n{1}"
- raw: "侧面攻击提升5%伤害及命中，\\n背后攻击则提升10%。"
  splits:
  - text: "侧面攻击提升5%伤害及命中，"
