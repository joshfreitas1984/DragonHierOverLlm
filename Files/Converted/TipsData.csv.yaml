- raw: "Tips"
  splits: []
- raw: "随身携带的珍宝，\\n若学识足够会每日自动尝试鉴定。"
  splits:
  - text: "随身携带的珍宝，\\n若学识足够会每日自动尝试鉴定。"
    translated: "Treasure always at hand,\\nIf knowledgeable enough, it will attempt to identify automatically every day."
- raw: "珍宝在鉴定后才能卖出更高价格。"
  splits:
  - text: "珍宝在鉴定后才能卖出更高价格。"
    translated: "Treasures can only fetch higher prices after appraisal."
- raw: "声望达到对方一半才能结识。"
  splits:
  - text: "声望达到对方一半才能结识。"
    translated: "You must have reputation equal to half of the other party's before you can be acquainted."
- raw: "门派的占领区域达到上限后，\\n就无法占领新的区域。"
  splits:
  - text: "门派的占领区域达到上限后，\\n就无法占领新的区域。"
    translated: "After the occupied area of the Sect reaches its limit,\\nThus, new areas could not be conquered"
- raw: "门派的弟子人口达到上限后，\\n就无法招募新的弟子。"
  splits:
  - text: "门派的弟子人口达到上限后，\\n就无法招募新的弟子。"
    translated: "When the disciples' population of the sect reaches its limit,\\nNew disciples cannot be recruited"
- raw: "每一级别的武功都有修习数量上限，\\n超出上限后所有该级别武功获得的经验都会减少。"
  splits:
  - text: "每一级别的武功都有修习数量上限，\\n超出上限后所有该级别武功获得的经验都会减少。"
    translated: "Each level of martial arts has an upper limit to the number that can be practiced.\\nExceeding this limit will result in reduced experience gain for all martial arts at that level."
- raw: "装备负重会影响角色在战斗中的速度。"
  splits:
  - text: "装备负重会影响角色在战斗中的速度。"
    translated: "Equipping weight will affect the character's speed in battle."
- raw: "成为掌门后，可以在京城皇宫获取御赐勋阶。"
  splits:
  - text: "成为掌门后，可以在京城皇宫获取御赐勋阶。"
    translated: "Becoming the Sect Leader allows you to obtain imperial granted titles in the capital palace."
- raw: "在官府获取官职后，便可以替朝廷效力。"
  splits:
  - text: "在官府获取官职后，便可以替朝廷效力。"
    translated: "After obtaining a position in the government, one can serve the court."
- raw: "野外有时会出现强力恶贼，\\n此时应绕道而行，以免遭到袭击。"
  splits:
  - text: "野外有时会出现强力恶贼，\\n此时应绕道而行，以免遭到袭击。"
    translated: "\\nBandits can sometimes appear in the wilderness,\\nsince it's wise to detour to avoid an attack."
- raw: "探索起始时，偶尔会察觉到高人气息。\\n此时若仔细搜寻，定会有意外收获。"
  splits:
  - text: "探索起始时，偶尔会察觉到高人气息。\\n此时若仔细搜寻，定会有意外收获。"
    translated: "At the beginning of exploration, one might occasionally sense the presence of a master.\\nIf you search carefully at such times, you are sure to make unexpected discoveries."
- raw: "秘籍品质越高，阅读中越容易出现较好的方格。"
  splits:
  - text: "秘籍品质越高，阅读中越容易出现较好的方格。"
    translated: "The higher the quality of the secret technique, the more likely it is to have better cells while reading."
- raw: "放在藏经阁内的秘籍会根据品质，\\n提升全门派修习该武学的速度。"
  splits:
  - text: "放在藏经阁内的秘籍会根据品质，\\n提升全门派修习该武学的速度。"
    translated: "The secret manuals placed in the Treasure Repository will be categorized based on their quality,\\nIncrease the speed at which all sects practice this martial art."
- raw: "好感达到50后可以成为朋友。"
  splits:
  - text: "好感达到50后可以成为朋友。"
    translated: "After reaching 50 goodwill, they can become friends."
- raw: "好感达到100后，可以让关系更进一步。"
  splits:
  - text: "好感达到100后，可以让关系更进一步。"
    translated: "After goodwill reaches 100, you can take the relationship to the next level."
- raw: "恶名过高时进入城镇，\\n很可能会被官府或城内侠士抓捕。"
  splits:
  - text: "恶名过高时进入城镇，\\n很可能会被官府或城内侠士抓捕。"
    translated: "Enter the town when your reputation is too low.\\nVery likely to be apprehended by the official authorities or the martial heroes within the city."
- raw: "行囊超重会减慢你的大地图旅行速度。"
  splits:
  - text: "行囊超重会减慢你的大地图旅行速度。"
    translated: "Excess luggage will slow down your travel speed on the world map."
- raw: "穿着过于沉重的装备会减慢你的战斗速度。"
  splits:
  - text: "穿着过于沉重的装备会减慢你的战斗速度。"
    translated: "Wearing overly heavy equipment will slow down your combat speed."
- raw: "在编纂秘籍时，\\n你可以将两本低品质秘籍合成一本高品质秘籍。"
  splits:
  - text: "在编纂秘籍时，\\n你可以将两本低品质秘籍合成一本高品质秘籍。"
    translated: "While compiling the grimoire,\\nyou can combine two low‑quality books into one high‑quality book."
- raw: "与对方的性格越接近，好感提升越快。"
  splits:
  - text: "与对方的性格越接近，好感提升越快。"
    translated: "The closer your personality matches theirs, the faster your liking towards each other will increase."
- raw: "与对方的立场越接近，初始好感越高。"
  splits:
  - text: "与对方的立场越接近，初始好感越高。"
    translated: "The higher the initial affinity starts at if your stance aligns more closely with the other party."
- raw: "较高的恶名会降低好感获取，\\n其他侠士在野外遭遇时也会避而远之。"
  splits:
  - text: "较高的恶名会降低好感获取，\\n其他侠士在野外遭遇时也会避而远之。"
    translated: "While higher notoriety reduces the chance of gaining favor,\\nother xia Shi in the wilderness will also avoid encountering them."
- raw: "袭击同门或亲朋好友，\\n会导致恶名成倍增加。"
  splits:
  - text: "袭击同门或亲朋好友，\\n会导致恶名成倍增加。"
    translated: "Attack fellow disciples or close friends,\\nIt will cause notoriety to increase exponentially"
- raw: "恶名每个月会自动衰减10%，\\n投案自首时也会减少10%。"
  splits:
  - text: "恶名每个月会自动衰减10%，\\n投案自首时也会减少10%。"
    translated: "Renown will automatically decay by 10% each month,\\nand it will also decrease by 10% when turning oneself in."
- raw: "在城镇或安全区内行凶作恶，\\n会导致恶名成倍增加。"
  splits:
  - text: "在城镇或安全区内行凶作恶，\\n会导致恶名成倍增加。"
    translated: "Committing crimes in towns or safe zones,\\nWill result in reputation points multiplying"
- raw: "探索耐力耗尽后，\\n每走一步都会消耗越来越多生命/内力。"
  splits:
  - text: "探索耐力耗尽后，\\n每走一步都会消耗越来越多生命/内力。"
    translated: "After exploring until endurance runs out,\\nEach step consumes more and more health/inner power."
- raw: "战斗中某项伤势较高时，\\n会获得针对该伤势的临时抗性。"
  splits:
  - text: "战斗中某项伤势较高时，\\n会获得针对该伤势的临时抗性。"
    translated: "During combat, when a particular injury is significant,\\na temporary resistance to that injury will be gained."
- raw: "战斗中一名角色败退时，\\n其所控制的机关兽也都会败退。"
  splits:
  - text: "战斗中一名角色败退时，\\n其所控制的机关兽也都会败退。"
    translated: "When a character retreats in battle,\\nthe mecha beasts they control will also retreat."
- raw: "在西域灵州的莫高窟中，\\n可闭关遗忘已有的零级武学或天赋。"
  splits:
  - text: "在西域灵州的莫高窟中，\\n可闭关遗忘已有的零级武学或天赋。"
    translated: "In the Mogao Caves of Lingzhou in the Western Regions,\\nYou can enter seclusion to forget your existing First‑Rank Martial Arts or Talents."
- raw: "外功武学的突破效果，\\n只有在使用该武学时才会生效。"
  splits:
  - text: "外功武学的突破效果，\\n只有在使用该武学时才会生效。"
    translated: "The effect of breaking through external skill martial arts\\nwill only take place when using that particular martial art."
- raw: "京城的私宅因为等级最高，\\n价格自然也最贵。"
  splits:
  - text: "京城的私宅因为等级最高，\\n价格自然也最贵。"
    translated: "The private residences in the capital, being of the highest grade,\\nThe price is naturally also the most expensive."
- raw: "战场局势瞬息万变，\\n对付实力较弱者也不可掉以轻心。"
  splits:
  - text: "战场局势瞬息万变，\\n对付实力较弱者也不可掉以轻心。"
    translated: "The battlefield situation changes rapidly, '\\n' and one must not be careless when dealing with weaker opponents."
- raw: "侧面攻击提升5%伤害及命中，\\n背后攻击则提升10%。"
  splits:
  - text: "侧面攻击提升5%伤害及命中，\\n背后攻击则提升10%。"
    translated: "Side attacks increase 5% damage and hit rate,\\nrear attacks increase 10% respectively."
- raw: "行走江湖不能一味单打独斗，\\n多与其他侠士组队同行，方为万全之法。"
  splits:
  - text: "行走江湖不能一味单打独斗，\\n多与其他侠士组队同行，方为万全之法。"
    translated: "Traversing the Jianghu cannot rely solely on individual strength.\\nTeam up with other heroes to ensure everything goes smoothly."
