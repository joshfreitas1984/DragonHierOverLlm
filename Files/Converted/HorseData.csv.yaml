  - split: 1
    text: "赤兔马"
    translated: "Red Horse"
  - split: 2
    text: "遍体火红，体型庞大之骏马，冲锋时势大力猛，如烈火燎原，堪称马中王者"
    translated: "A large, fiery‑red horse that charges with immense force, like a prairie fire, truly reigning as the king of horses."
- raw: "42,的卢马,速度迅捷，跳跃冲刺能力亦极为惊人的名马，传说其先祖曾背负刘备越过阔数丈的檀溪,5,75,60,95,70,6400"
  splits:
