  - split: 2
    text: "应策腾空，承声半汉，入险摧敌，乘危济难，其先祖乃突厥名马，作为贡品随唐太宗征战多年"
    translated: "Leaping into the air with strategy, carrying the voice half in Chinese, entering danger to crush enemies, seizing opportunities to overcome difficulties‑his ancestors were renowned horses of the Turkic people, serving as gifts and accompanying Emperor Taizong of Tang on many battles for years."
- raw: "45,神凫马,传说祖先乃秦始皇座下名马，为求仙药随其东巡，过名川大山如飞履平地,5,95,50,70,85,6400"
