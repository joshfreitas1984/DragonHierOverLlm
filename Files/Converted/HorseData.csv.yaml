  - split: 2
    text: "传说祖先乃秦始皇座下名马，为求仙药随其东巡，过名川大山如飞履平地"
    translated: "Legend says that the ancestors were famous horses under Emperor Qin Shi Huang. Seeking immortal medicines, they accompanied him on his eastern tour, traversing renowned rivers and mountains as if flying."
- raw: "46,飒露紫,紫燕超跃，骨腾神骏，气詟三川，威凌八阵，其先祖曾为救唐太宗于重围之中而殒命，可谓忠勇过人,5,60,85,80,75,6400"
  splits:
