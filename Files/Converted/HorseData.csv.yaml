    text: "飒露紫"
    translated: "Slapuizi"
  - split: 2
    text: "紫燕超跃，骨腾神骏，气詟三川，威凌八阵，其先祖曾为救唐太宗于重围之中而殒命，可谓忠勇过人"
    translated: "While they soar like purple swallows, their bones leap like spirit horses. Their ancestral valor shakes the Three Rivers and deters eight arrays. They once sacrificed their lives to save Emperor Taizong of Tang from a heavy encirclement, displaying unparalleled loyalty and bravery."
