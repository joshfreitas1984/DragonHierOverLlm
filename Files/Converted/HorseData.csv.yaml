  - split: 2
    text: "速度迅捷，跳跃冲刺能力亦极为惊人的名马，传说其先祖曾背负刘备越过阔数丈的檀溪"
    translated: "A famed horse known for its speed and extraordinary leaping prowess, legend says its ancestor carried Liu Bei across a wide Tanchi stream."
- raw: "43,绝影马,风驰电掣，连影子亦追随不及之快马，传说曹操曾骑其先祖逃脱重围,5,85,75,75,65,6400"
