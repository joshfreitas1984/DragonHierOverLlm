    translated: "Wind swift as lightning, a steed so fast not even its shadow could follow, legend says Cao Cao rode his ancestor's mount to escape the encirclement."
- raw: "44,特勒骠,应策腾空，承声半汉，入险摧敌，乘危济难，其先祖乃突厥名马，作为贡品随唐太宗征战多年,5,65,90,65,80,6400"
  splits:
  - split: 1
    text: "特勒骠"
