  splits:
  - split: 1
    text: "名字"
    translated: "Name"
  - split: 2
    text: "描述"
    translated: "Description"
  - split: 3
    text: "坐标"
    translated: "Coordinates"
- raw: "0,有间客栈,这本是关外一无名小客栈，传说店家愿出高价，求名士题匾额一副，以振声望。\\n前朝文豪恰巧行径此处，抚掌笑曰：既然此处有间客栈，就叫“有间客栈”好了！\\n随战乱不断，商路迁移，此处生意竟真逐渐转暖，最终成了关东首屈一指的客店之所。,37.85;22.1"
  splits:
  - split: 1
    text: "有间客栈"
    translated: "A Moment's Inn"
  - split: 2
    text: "这本是关外一无名小客栈，传说店家愿出高价，求名士题匾额一副，以振声望。"
    translated: "This was originally an unremarkable small inn beyond the borders. Legend has it that the proprietor offered a high reward to scholars seeking to inscribe a plaque, hoping to boost their reputation."
  - split: 2
    subIndex: 1
    text: "前朝文豪恰巧行径此处，抚掌笑曰：既然此处有间客栈，就叫"
    translated: "Former literary giants stroll herein and clap in amusement: Since there is an inn here, let's call it"
  - split: 2
    subIndex: 2
    text: "有间客栈"
    translated: "A Moment's Inn"
  - split: 2
    subIndex: 3
    text: "好了！"
    translated: "Okay!"
  - split: 2
    subIndex: 4
    text: "随战乱不断，商路迁移，此处生意竟真逐渐转暖，最终成了关东首屈一指的客店之所。"
    translated: "With warfare and unrest leading to the migration of trade routes, business here gradually picked up. Eventually, it became the top guesthouse in Guandong."
  templates:
  - split: 2
    template: "{0}\\n{1}“{2}”{3}\\n{4}"
- raw: "1,河洛客栈,这黄河洛水交接之所，乃炎黄故地，中原要冲，自古以来便是土地肥沃，人丁兴旺之所。\\n故而这天子脚下的河洛客栈，生意也一直颇为兴隆。\\n南方的游人学子，或官员商贾上京之时，大多要在此打尖歇脚几日，再行赶路。,23.78;2.4"
  splits:
  - split: 1
    text: "河洛客栈"
    translated: "River Luo Inn"
  - split: 2
    text: "这黄河洛水交接之所，乃炎黄故地，中原要冲，自古以来便是土地肥沃，人丁兴旺之所。"
    translated: "This confluence of the Yellow River and Luo Water, is the ancestral land of Yan and Huang, a crucial point in Central Plains. Since ancient times, it has been fertile land with a thriving population."
  - split: 2
    subIndex: 1
    text: "故而这天子脚下的河洛客栈，生意也一直颇为兴隆。"
    translated: "As a result, business at the He Luo Inn beneath this emperor's feet has remained quite prosperous."
  - split: 2
    subIndex: 2
    text: "南方的游人学子，或官员商贾上京之时，大多要在此打尖歇脚几日，再行赶路。"
    translated: "Travelers and scholars from the south, or officials and merchants heading to the capital, often stop here for a few days to rest and refuel before continuing their journey."
  templates:
  - split: 2
    template: "{0}\\n{1}\\n{2}"
- raw: "2,兴隆客栈,这兴隆客栈乃是南方规模最大，名望最盛的客店之一，\\n由于位于连通中原与南方诸郡以及福州港口的必经之路上，因此也常常门庭若市，座无虚席，\\n可谓店如其名，生意兴隆。,34.4;-20.4"
  splits:
  - split: 1
    text: "兴隆客栈"
    translated: "Prosperous Inn"
  - split: 2
    text: "这兴隆客栈乃是南方规模最大，名望最盛的客店之一，"
    translated: "This Prosperous Inn is one of the largest and most renowned inns in the south."
  - split: 2
    subIndex: 1
    text: "由于位于连通中原与南方诸郡以及福州港口的必经之路上，因此也常常门庭若市，座无虚席，"
    translated: "Since it lies on the crucial route connecting the Central Plains and southern prefectures, as well as Fuzhou port, it is often bustling with people and always full of seats."
  - split: 2
    subIndex: 2
    text: "可谓店如其名，生意兴隆。"
    translated: "As expected from its name, the business is thriving."
  templates:
  - split: 2
    template: "{0}\\n{1}\\n{2}"
- raw: "3,悦来客栈,这晋阳西南，边陲要冲，亦是中原与北方各地交通往来的重要之所，\\n“悦来”其名取自“有朋自远方来，不亦悦乎”，\\n此处往来汉人羌胡以及各番邦者，倒也确是共聚一堂，自得融洽。,3.46;25.71"
  splits:
  - split: 1
    text: "悦来客栈"
    translated: "Yue Coming Inn"
  - split: 2
    text: "这晋阳西南，边陲要冲，亦是中原与北方各地交通往来的重要之所，"
    translated: "This Jinyang, located southwest of the border and a crucial junction, is also an important hub for transportation between Central China and various northern regions."
  - split: 2
    subIndex: 1
    text: "悦来"
    translated: "Joyful Come"
  - split: 2
    subIndex: 2
    text: "其名取自"
    translated: "Its name comes from"
  - split: 2
    subIndex: 3
    text: "有朋自远方来，不亦悦乎"
    translated: "A friend coming from afar brings great joy, does it not?"
  - split: 2
    subIndex: 4
    text: "此处往来汉人羌胡以及各番邦者，倒也确是共聚一堂，自得融洽。"
    translated: "Here, the Han people, Qiang Hu, and various foreign nations do indeed gather together and find mutual harmony."
  templates:
  - split: 2
    template: "{0}\\n“{1}”{2}“{3}”，\\n{4}"
- raw: "4,龙门客栈,西北关外，荒烟蔓草，滚滚黄沙中，\\n竟有这间生意不俗，行人络绎的龙门客栈，着实令往来行者眼前一亮。\\n不过也有江湖传闻，其老板娘八面玲珑，妩媚泼辣，通过掌控出关商道和边防将领，经营黑店谋取暴利。,-41.53;19.92"
  splits:
  - split: 1
    text: "龙门客栈"
    translated: "Dragon Gate Inn"
  - split: 2
    text: "西北关外，荒烟蔓草，滚滚黄沙中，"
    translated: "Outside the Western Pass, desolate smoke and overgrown grass, rolling yellow sandaguesiniai"
  - split: 2
    subIndex: 1
    text: "竟有这间生意不俗，行人络绎的龙门客栈，着实令往来行者眼前一亮。"
    translated: "This prosperous Dragon Gate Inn, with its steady stream of travelers, truly brightens the eyes of those who pass by."
  - split: 2
    subIndex: 2
    text: "不过也有江湖传闻，其老板娘八面玲珑，妩媚泼辣，通过掌控出关商道和边防将领，经营黑店谋取暴利。"
    translated: "However, there are also rumors in the Jianghu about his madam being astute and captivating, wielding power through controlling trade routes and border generals to operate black shops and make enormous profits."
  templates:
  - split: 2
    template: "{0}\\n{1}\\n{2}"
- raw: "5,高升客栈,此处乃巴蜀地区重要水陆驿站，由于其名取“步步高升”之意，颇受往来商贾旅人的欢迎，\\n加之其位于巴蜀与西北地区间几乎必经的要道之上，因而每日也是顾客盈门，高朋满座。,-18.07;10.89"
  splits:
  - split: 1
    text: "高升客栈"
    translated: "High Riser Inn"
  - split: 2
    text: "此处乃巴蜀地区重要水陆驿站，由于其名取"
    translated: "This place is an important water and land relay station in the Bashu region, named due to its location."
  - split: 2
    subIndex: 1
    text: "步步高升"
    translated: "Promote step by step"
  - split: 2
    subIndex: 2
    text: "之意，颇受往来商贾旅人的欢迎，"
    translated: "Is particularly popular among merchants and travelers"
  - split: 2
    subIndex: 3
    text: "加之其位于巴蜀与西北地区间几乎必经的要道之上，因而每日也是顾客盈门，高朋满座。"
    translated: "Given its location on a nearly indispensable passageway between Bashu and the Northwest regions, it thus sees customers and esteemed guests every day."
  templates:
  - split: 2
    template: "{0}“{1}”{2}\\n{3}"
- raw: "6,仙居客栈,此处乃是江陵一带颇具声名之驿站，\\n因其周边风景秀美，名山屏卫，云雾缭绕宛若神仙居所，故而得名“仙居客栈”。\\n在此处打尖住店之人，大多是往来于南方和中原地区的商贾游人，或是赶考学子。,-5.92;-18.19"
  splits:
  - split: 1
    text: "仙居客栈"
    translated: "Xianju Inn"
  - split: 2
    text: "此处乃是江陵一带颇具声名之驿站，"
    translated: "This is a renowned relay station in the Jiangling region."
  - split: 2
    subIndex: 1
    text: "因其周边风景秀美，名山屏卫，云雾缭绕宛若神仙居所，故而得名"
    translated: "Due to its picturesque surroundings and misty peaks that resemble a dwelling for immortals, it is named thus."
  - split: 2
    subIndex: 2
    text: "仙居客栈"
    translated: "Xianju Inn"
  - split: 2
    subIndex: 3
    text: "在此处打尖住店之人，大多是往来于南方和中原地区的商贾游人，或是赶考学子。"
    translated: "Those who stay at inns here are mostly merchants and travelers going between the South and Central Plains, or students heading to take exams."
  templates:
  - split: 2
    template: "{0}\\n{1}“{2}”。\\n{3}"
- raw: "7,同福客栈,这同福客栈本是京城西南一名不见经传的破落小店，依靠零星商旅勉强维持。\\n近年来由于飞龙门得势，依靠拜会山门和进京上贡的武林中人，生意倒也颇有起色，\\n竟逐渐成了江湖传闻中卧虎藏龙，高手云集之所。,-1.19;9.97"
  splits:
  - split: 1
    text: "同福客栈"
    translated: "Tongfu Inn"
  - split: 2
    text: "这同福客栈本是京城西南一名不见经传的破落小店，依靠零星商旅勉强维持。"
    translated: "This Tongfu Inn was originally a nameless, struggling small shop in the southwest of the Capital, barely sustaining itself on sporadic travelers."
  - split: 2
    subIndex: 1
    text: "近年来由于飞龙门得势，依靠拜会山门和进京上贡的武林中人，生意倒也颇有起色，"
    translated: "In recent years, with Flying Dragon Gate gaining influence, business has flourished thanks to the visits of Wulin practitioners from Baihui Mountain and those making offerings in the capital."
  - split: 2
    subIndex: 2
    text: "竟逐渐成了江湖传闻中卧虎藏龙，高手云集之所。"
    translated: "Gradually, it became a place in the Jianghu where dragons lay hidden and masters congregated."
  templates:
  - split: 2
    template: "{0}\\n{1}\\n{2}"
- raw: "8,万安客栈,这万安客栈位于西南边陲，大理城附近的交通要道上，\\n再向西行便会进入高原苦寒之地，崎岖坎坷，罕有人烟，\\n往来旅人大多选择在此整备行囊，顺便祈福颂愿，以求路途之中“万事平安”。,-38.9;-5.6"
  splits:
  - split: 1
    text: "万安客栈"
    translated: "Wan'an Inn"
  - split: 2
    text: "这万安客栈位于西南边陲，大理城附近的交通要道上，"
    translated: "This Wan'an Inn is located on an important transportation route near Dali City in the southwest."
  - split: 2
    subIndex: 1
    text: "再向西行便会进入高原苦寒之地，崎岖坎坷，罕有人烟，"
    translated: "Continuing west will lead you into the highlands, a harsh and barren region with rugged terrain and sparse population."
  - split: 2
    subIndex: 2
    text: "往来旅人大多选择在此整备行囊，顺便祈福颂愿，以求路途之中"
    translated: "Most travelers tend to prepare their provisions here and also offer prayers for safe travels."
  - split: 2
    subIndex: 3
    text: "万事平安"
    translated: "May all be well"
  templates:
  - split: 2
    template: "{0}\\n{1}\\n{2}“{3}”。"
- raw: "9,秀水客栈,这秀水客栈形制古朴，装饰精美，自前朝建设以来已有百年历史。\\n由于位于扬州与杭州之间通衢要道，颇受往来商贾欢迎，\\n更兼其周边山明水秀，风光宜人，因而也吸引了许多四方旅人专程来此游览。,53.85;-3.78"
  splits:
  - split: 1
    text: "秀水客栈"
    translated: "Xiu Shui Inn"
  - split: 2
    text: "这秀水客栈形制古朴，装饰精美，自前朝建设以来已有百年历史。"
    translated: "This ancient yet elegantly decorated Xiu Shui Inn was built over a century ago during the previous dynasty."
  - split: 2
    subIndex: 1
    text: "由于位于扬州与杭州之间通衢要道，颇受往来商贾欢迎，"
  - split: 2
    subIndex: 2
    text: "更兼其周边山明水秀，风光宜人，因而也吸引了许多四方旅人专程来此游览。"
    translated: "Moreover, with its surroundings featuring lush mountains and clear waters, the scenery is delightful, attracting many travelers from all directions who come specifically to visit."
  templates:
  - split: 2
    template: "{0}\\n{1}\\n{2}"
