- raw: "武学见解,依我所见，武学的精要之处在于战无不胜，攻无不克,依我所见，武学的精要之处在于勤学苦练，登峰造极,依我所见，武学的精要之处在于步步为营，攻守兼备,依我所见，武学的精要之处在于修身养性，仁者无敌,依我所见，武学的精要之处在于删繁就简，返璞归真,依我所见，武学的精要之处在于活学活用，灵巧多变,依我所见，武学的精要之处在于行云流水，挥洒自如,依我所见，武学的精要之处在于避实就虚，随心所欲,依我所见，武学的精要之处在于算无遗策，克敌机先,依我所见，武学的精要之处在于破除陈规，剑走偏锋"
  splits:
  - text: "武学见解"
    translated: "Martial insights"
  - split: 1
    text: "依我所见，武学的精要之处在于战无不胜，攻无不克"
    translated: "As I see it, the essence of martial arts lies in invincibility and unconquerability."
  - split: 2
    text: "依我所见，武学的精要之处在于勤学苦练，登峰造极"
    translated: "In my opinion, the essence of martial arts lies in diligent practice and striving for perfection."
  - split: 3
    text: "依我所见，武学的精要之处在于步步为营，攻守兼备"
    translated: "In my opinion, the essence of martial arts lies in advancing with caution and defending while attacking."
  - split: 4
    text: "依我所见，武学的精要之处在于修身养性，仁者无敌"
    translated: "In my view, the essence of martial arts lies in cultivating one's body and mind, and the benevolent are invincible."
  - split: 5
    text: "依我所见，武学的精要之处在于删繁就简，返璞归真"
    translated: "In my opinion, the essence of martial arts lies in simplifying complexity and returning to simplicity."
  - split: 6
    text: "依我所见，武学的精要之处在于活学活用，灵巧多变"
    translated: "In my opinion, the essence of martial arts lies in flexible application and adaptability."
  - split: 7
    text: "依我所见，武学的精要之处在于行云流水，挥洒自如"
    translated: "In my opinion, the essence of martial arts lies in its fluidity and natural grace."
  - split: 8
    text: "依我所见，武学的精要之处在于避实就虚，随心所欲"
    translated: "In my opinion, the essence of martial arts lies in avoiding the real and striking the void, acting according to one's will."
  - split: 9
    text: "依我所见，武学的精要之处在于算无遗策，克敌机先"
    translated: "In my view, the essence of martial arts lies in devising strategies without fail and gaining the upper hand before the enemy."
  - split: 10
    text: "依我所见，武学的精要之处在于破除陈规，剑走偏锋"
    translated: "In my opinion, the essence of martial arts lies in breaking conventional rules and taking an unconventional approach with the sword."
- raw: "休闲娱乐,一旦做起喜欢的事就会废寝忘食，#PlayerName#也会如此吗？,若是这门功夫一日不练成，我便一日不得安寝。,#PlayerName#近日练功可有懈怠？需知江湖中人若习武不精，早晚会吃苦头,今日艳阳高照，正适合邀三五好友郊游野炊一番,躺着不动，静静发呆也是一件美事，#PlayerName#也这么认为吧！,我正要去街上闲逛，#PlayerName#若是想来的话就同去吧,#PlayerName#来的正好，难得浮生偷闲，快随我同去痛饮几杯！,听说城中名伶正登台唱戏，#PlayerName#何不随我去听几首小曲，快活快活？,若是一事不能增进武艺或谋取利益，我便万万不愿去做,我已习惯独来独往，#PlayerName#若是无事，还望别来打扰。"
