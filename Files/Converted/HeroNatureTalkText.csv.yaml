- raw: "诗词歌赋,击筑复击筑，欲歌双泪横。宝刀重如命，命如鸿毛轻。,日出扶桑一丈高，人间万事细如毛。野夫怒见不平事，磨损胸中万古刀。,滚滚长江东逝水，浪花淘尽英雄。是非成败转头空，青山依旧在，几度夕阳红。,士卒涂草莽，将军空尔为。乃知兵者是凶器，圣人不得已而用之。,十年磨一剑，霜刃未曾试。今日把示君，谁有不平事？,贵逼人来不自由，龙翔凤翥势难收。满堂花醉三千客，一剑霜寒十四州。,人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。,名花倾国两相欢，长得君王带笑看。解释春风无限恨，沉香亭北倚阑干。,飞剑纵横乍可惊，翻疑风俗妄传声。如今至穷在何处，不出为人平不平。,十步杀一人，千里不留行。事了拂衣去，深藏身与名。"
  splits:
  - text: "诗词歌赋"
    translated: "Poetry and verse"
  - split: 1
    text: "击筑复击筑，欲歌双泪横。宝刀重如命，命如鸿毛轻。"
    translated: "Striking the zhu again and again, tears well up as I sing. My precious blade weighs like a life, while life is as light as goose down."
  - split: 2
    text: "日出扶桑一丈高，人间万事细如毛。野夫怒见不平事，磨损胸中万古刀。"
    translated: "The sun rises in Su Feng at ten feet high,   Man's affairs are as fine as hair.   Furrowed by rage at unjust deeds,   My chest wears down the ancient blade within me."
  - split: 3
    text: "滚滚长江东逝水，浪花淘尽英雄。是非成败转头空，青山依旧在，几度夕阳红。"
    translated: "The Yangtze flows on to the east, washing away heroes. Gains and losses turn to nothing; green mountains remain, as do several settings of sunset."
  - split: 4
    text: "士卒涂草莽，将军空尔为。乃知兵者是凶器，圣人不得已而用之。"
    translated: "Soldiers lie amid the grass and weeds, while generals vainly act. Thus it is known that weapons are instruments of evil; sages use them only when compelled."
  - split: 5
    text: "十年磨一剑，霜刃未曾试。今日把示君，谁有不平事？"
    translated: "Ten years to sharpen one sword; its frosty edge has yet to be tested. Today I show it to you, who has the grievances yet unrighted?"
  - split: 6
    text: "贵逼人来不自由，龙翔凤翥势难收。满堂花醉三千客，一剑霜寒十四州。"
    translated: "Compelled by one's status, the dragon soars and the phoenix rises, a momentum that cannot be halted. A sword's chill spans fourteen states as it intoxicates three thousand guests with its floral fragrance."
  - split: 7
    text: "人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。"
    translated: "Life is short; make the most of it by rejoicing. Do not let golden goblets remain empty under the moon. Heaven endowed me with talents that must serve some purpose; even if I spend a thousand gold pieces, they will come back to me."
  - split: 8
    text: "名花倾国两相欢，长得君王带笑看。解释春风无限恨，沉香亭北倚阑干。"
    translated: "A beauty and the emperor both delight,   With his smile and laughter, they draw him in. In the spring breeze, their charm erases all resentment, by the fragrant pavilion railing, they lean on the rail."
  - split: 9
    text: "飞剑纵横乍可惊，翻疑风俗妄传声。如今至穷在何处，不出为人平不平。"
    translated: "Whirling sword strokes startle; one might doubt if they are mere rumors. Now where lies true poverty? Not but to right what is unjust for people."
  - split: 10
    text: "十步杀一人，千里不留行。事了拂衣去，深藏身与名。"
    translated: "Ten steps to kill one man, a thousand miles go unimpeded. After matters are resolved, I depart quietly, hiding my presence and name."
- raw: "为人处世,能够不断精进武艺，磨炼心性，实在是人生一大乐事。,即便穷极此生，也要追寻武学之至高境界。,江湖中人需得处处小心谨慎，行差踏错一步，就可能招来杀身之祸。,得道多助，失道寡助，行走江湖还需以道义为重。,在乱世中能够平平淡淡，无病无灾，便已是大幸了。,自由自在，来去如风的江湖生活，怎能不令人心驰神往？,什么皇图霸业，不过几杯浊酒，三两笑谈罢了。,人生在世数十载，弹指一挥间，还是应当及时行乐才是。,宁教我负天下人，休教天下人负我。,与我为敌之人，自是应当赶尽杀绝才是。"
  splits:
  - text: "为人处世"
    translated: "Mannerly behavior"
  - split: 1
    text: "能够不断精进武艺，磨炼心性，实在是人生一大乐事。"
    translated: "To constantly refine one's martial arts and temper one's spirit is truly a great joy in life."
  - split: 2
    text: "即便穷极此生，也要追寻武学之至高境界。"
    translated: "Even if this life is impoverished, one must strive for the pinnacle of martial arts."
  - split: 3
    text: "江湖中人需得处处小心谨慎，行差踏错一步，就可能招来杀身之祸。"
    translated: "In the Jianghu, one must be constantly careful and cautious; a single misstep could bring about fatal trouble."
  - split: 4
    text: "得道多助，失道寡助，行走江湖还需以道义为重。"
    translated: "Those who follow the way gain many helpers, while those who do not lose most. Thus, traveling in the Jianghu means prioritizing righteousness."
  - split: 5
    text: "在乱世中能够平平淡淡，无病无灾，便已是大幸了。"
    translated: "In times of chaos, to live calmly without suffering is already a great blessing."
  - split: 6
    text: "自由自在，来去如风的江湖生活，怎能不令人心驰神往？"
    translated: "The carefree life of the Jianghu, moving like the wind, how could it not captivate the heart?"
  - split: 7
    text: "什么皇图霸业，不过几杯浊酒，三两笑谈罢了。"
    translated: "What grand ambitions and dominions are but a few cups of murky wine and casual conversations?"
  - split: 8
    text: "人生在世数十载，弹指一挥间，还是应当及时行乐才是。"
    translated: "Life in this world is but a dozen decades, a blink of an eye. It's best to enjoy oneself while one can."
  - split: 9
    text: "宁教我负天下人，休教天下人负我。"
    translated: "Better that I betray all under heaven than that all under heaven betray me."
  - split: 10
    text: "与我为敌之人，自是应当赶尽杀绝才是。"
    translated: "Those who oppose me should be hunted down and destroyed without mercy."
- raw: "对待朋友,人生在世，能得一两知己，便已足够。,君子一诺值千金，对待朋友必当生死相依，不离不弃。,知人知面不知心，在结交朋友时，也应当思量三分，不可率性而为。,对待朋友应当肝胆相照，毫无保留，#PlayerName#想必也如此认为。,对待他人若是真心实意，他人自然也会以真心回报。,缘起相聚，缘散别离，江湖中人身若浮萍，无外如是。,不论正邪贵贱，男女老少，只要能共饮三杯，便是朋友一场。,窈窕淑女，君子好逑，如此风雅之事，又何罪之有？,若没有利用价值，这样的朋友不如不交。,江湖中所谓知己好友，大多是酒肉之交，相互利用罢了。"
  splits:
  - text: "对待朋友"
    translated: "Treat friends"
  - split: 1
    text: "人生在世，能得一两知己，便已足够。"
    translated: "In this life, to have one or two true friends is enough."
  - split: 2
    text: "君子一诺值千金，对待朋友必当生死相依，不离不弃。"
    translated: "A gentleman's word is worth a thousand gold, so one must be willing to stake life and death for friends, never leaving their side."
  - split: 3
    text: "知人知面不知心，在结交朋友时，也应当思量三分，不可率性而为。"
    translated: "A man may know another by his face but not by his heart; when making friends, one should consider things carefully and not act on impulse."
  - split: 4
    text: "对待朋友应当肝胆相照，毫无保留，#PlayerName#想必也如此认为。"
    translated: "Treating friends with openness and honesty, without reservation, #PlayerName# must believe in the same way."
  - split: 5
    text: "对待他人若是真心实意，他人自然也会以真心回报。"
    translated: "Treat others with sincerity, and they will naturally return your sincerity in kind."
  - split: 6
    text: "缘起相聚，缘散别离，江湖中人身若浮萍，无外如是。"
    translated: "Meeting in the Jianghu, parting as its tides ebb and flow. In the world of men here, lives are like floating waterplants, ever thus."
  - split: 7
    text: "不论正邪贵贱，男女老少，只要能共饮三杯，便是朋友一场。"
    translated: "No matter whether one is good or evil, noble or humble, young or old, as long as you can share three drinks together, you are friends for life."
  - split: 8
    text: "窈窕淑女，君子好逑，如此风雅之事，又何罪之有？"
    translated: "A gentleman admires the virtuous and graceful lady‑what crime is there in such refined pursuits?"
  - split: 9
    text: "若没有利用价值，这样的朋友不如不交。"
    translated: "If such a friend has no utilitarian value, it's better not to have them."
  - split: 10
    text: "江湖中所谓知己好友，大多是酒肉之交，相互利用罢了。"
    translated: "In the Jianghu, so‑called close friends are mostly acquaintances who use each other for their own benefit."
- raw: "对待仇敌,兵来将挡，水来土掩，若有人与我为敌，我便要与他分个高下。,冤家自是宜解不宜结，但一旦结下，便定要赶尽杀绝。,行走江湖，危机四伏，还是不要与人轻易结下仇怨为妙。,江湖中人以和为贵，若能化敌为友，化干戈为玉帛，岂不是美事一桩！,以德报怨，何以报德。对待为敌之人，不能心慈手软。,若遇到仇家上门，打得过就打，打不过只管逃跑便是。,往事如烟，去日苦多，没有什么仇怨是不能化解的。,遇上仇家，我自然要啐上他两口唾沫，方能一解心头之恨,天下熙熙，皆为利来，没有永远的敌友，只有永远的利益。,若有人敢与我为敌，我定要叫他后悔终生"
  splits:
  - text: "对待仇敌"
    translated: "Deal with enemies"
  - split: 1
    text: "兵来将挡，水来土掩，若有人与我为敌，我便要与他分个高下。"
    translated: "When soldiers come, generals will meet them; when water comes, soil will contain it. If someone opposes me, I shall see him through to the end and determine who is superior."
  - split: 2
    text: "冤家自是宜解不宜结，但一旦结下，便定要赶尽杀绝。"
    translated: "Enemies should be resolved rather than harbored. But once they are entrenched, one must root them out completely."
  - split: 3
    text: "行走江湖，危机四伏，还是不要与人轻易结下仇怨为妙。"
    translated: "Travelling through the Jianghu, dangers lurk everywhere, so it's best not to easily incur enmity with others."
  - split: 4
    text: "江湖中人以和为贵，若能化敌为友，化干戈为玉帛，岂不是美事一桩！"
    translated: "People in the Jianghu value harmony above all. If one could turn enemies into friends and weapons into jade, would that not be a splendid affair!"
  - split: 5
    text: "以德报怨，何以报德。对待为敌之人，不能心慈手软。"
    translated: "To forgive those who wrong us is well and good, but how do we repay those who have been kind? We must not show mercy to our enemies."
  - split: 6
    text: "若遇到仇家上门，打得过就打，打不过只管逃跑便是。"
    translated: "If enemies come looking for trouble, fight back if you can; if not, just run away."
  - split: 7
    text: "往事如烟，去日苦多，没有什么仇怨是不能化解的。"
    translated: "Past sorrows like smoke; many days have passed with much hardship. There is nothing in grievance that cannot be resolved."
  - split: 8
    text: "遇上仇家，我自然要啐上他两口唾沫，方能一解心头之恨"
    translated: "Encountering an enemy, I naturally have to spit on him twice to satisfy my resentment."
  - split: 9
    text: "天下熙熙，皆为利来，没有永远的敌友，只有永远的利益。"
    translated: "All comers to this world seek gain, for there are no eternal enemies or allies; only everlasting benefits."
  - split: 10
    text: "若有人敢与我为敌，我定要叫他后悔终生"
    translated: "If anyone dares to oppose me, I will make them regret it for the rest of their life."
- raw: "评价江湖,江湖纷扰，不过乱花迷人眼，修炼自身的武功心性，才是求真之道。,只要日夜苦练，百折不挠，定能在江湖上闯出一番名头！,江湖险恶，其中魑魅魍魉甚众，#PlayerName#还要多加小心啊。,若人人贯彻仁义之道，江湖也定能成为一方乐土。,江湖世事，纷乱繁杂，每每想到都令我头疼不已。,江湖风云，诡谲多变，唯有顺势而动，方能立于不败之地。,天下英雄出我辈，一入江湖岁月催，不知这乱世之中，最终几人成名，几人饮恨。,那些循规蹈矩，迂腐无趣的江湖大侠，却又偏偏好为人师，实在令人避之不及。,江湖中人多有侠义之名，可又有几人真能大公无私，行侠义之实呢？,时无英雄，使竖子成名，当下江湖所谓名门高手，实则大多酒囊饭袋而已。"
  splits:
  - text: "评价江湖"
    translated: "Rate the Jianghu"
  - split: 1
    text: "江湖纷扰，不过乱花迷人眼，修炼自身的武功心性，才是求真之道。"
    translated: "Tumult in the Jianghu is but a distraction. The true path lies in refining one's martial arts and inner nature."
  - split: 2
    text: "只要日夜苦练，百折不挠，定能在江湖上闯出一番名头！"
    translated: "Only through diligent practice day and night, never giving up, can one certainly make a name for oneself in the Jianghu!"
  - split: 3
    text: "江湖险恶，其中魑魅魍魉甚众，#PlayerName#还要多加小心啊。"
    translated: "Jianghu is perilous, with many demons and evil spirits lurking around. #PlayerName#, you should be even more cautious."
  - split: 4
    text: "若人人贯彻仁义之道，江湖也定能成为一方乐土。"
    translated: "If everyone upholds the way of benevolence and righteousness, the Jianghu can surely become a land of peace."
  - split: 5
    text: "江湖世事，纷乱繁杂，每每想到都令我头疼不已。"
    translated: "Jianghu affairs are complex and chaotic, causing me nothing but headaches whenever I think about them."
  - split: 6
    text: "江湖风云，诡谲多变，唯有顺势而动，方能立于不败之地。"
    translated: "The Jianghu is full of unpredictable changes; they must adapt accordingly to remain unbeaten."
  - split: 7
    text: "天下英雄出我辈，一入江湖岁月催，不知这乱世之中，最终几人成名，几人饮恨。"
    translated: "Heroes of the world arise in our age; upon entering the Jianghu, time presses on. Who knows in this chaotic world, how many will achieve fame, and how many will end in sorrow."
  - split: 8
    text: "那些循规蹈矩，迂腐无趣的江湖大侠，却又偏偏好为人师，实在令人避之不及。"
    translated: "Those rigid and boring Great Heroes of the Jianghu who insist on being teachers to others are truly best avoided."
  - split: 9
    text: "江湖中人多有侠义之名，可又有几人真能大公无私，行侠义之实呢？"
    translated: "People in the Jianghu are often known for their righteous names, but how many truly act with complete selflessness and real acts of chivalry?"
  - split: 10
    text: "时无英雄，使竖子成名，当下江湖所谓名门高手，实则大多酒囊饭袋而已。"
    translated: "When there are no heroes in the world, it allows upstarts to gain fame. In truth, most of the so‑called high‑ranking experts in today's Jianghu are little more than wine bellies and gluttons."
