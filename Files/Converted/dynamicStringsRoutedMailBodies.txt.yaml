- raw: "#PlayerName#，见字如面。近来长乐帮弟子已集结完毕，不日便会兵临<b>杭州</b>城下。还请您莫忘与妾身之约定，率#PlayerForceName#精锐前来助阵。\n若能成功光复杭州，擒拿贼人卢玉麟，妾身必当结草衔环以报君恩！"
