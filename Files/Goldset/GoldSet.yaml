    Real production pair mined from Files/Converted/dynamicStrings.txt.yaml (qcQualityScore: 85,
    qcStatus: Corrected, qcDefectCategory: HardToParseSeam as of the 2026-09-20 QC sample run) - a
    three-sub-split templated cell ("{0}⟦0⟧{1}\n{2}", where "{0}" is a literal in-game placeholder
    left untranslated by design, distinct from the split-join template's own numbering) reconstructed
    from Files/Converted's raw/qcReviewedText/qcTranslated fields.
  reviewNote: >-
    The pre-correction text ("This {0} The essence of it I have informed you.\nYou must continue to
    practice diligently to reach the next level.") is awkwardly merged where split 0 and split 1 join
    with no punctuation ("This {0} The essence of it..."), which is why production's QC pass flagged
    it HardToParseSeam and generated a correction - a legitimate trigger, unlike bdbe7026ca751cf2's
    unlabelled case. But the proposedCorrection does not fix that seam; it silently drops the entire
    second sentence ("You must continue to practice diligently to reach the next level.") - real
    in-game guidance telling the player they still need to practice, not a stylistic trim. This is a
    genuine harmful correction: it "resolves" a minor formatting complaint by deleting a full clause
    of gameplay-relevant content, the same failure shape Variant 2 (doubled verification) needs
    measurable examples of.
- sampleId: 20c9cb33bef6f1d5
  sampleKind: split
  source: "中脘"
  currentTranslation: "Upper Central Abdomen"
  label: Defect
  defectCategories: []
  proposedCorrection: "Zhongxuan"
  correctionSafety: harmful
  provenance: >-
    Real production pair mined from Files/Converted/dynamicStrings.txt.yaml (qcQualityScore: 85,
    qcStatus: Corrected as of the 2026-09-20 QC sample run) - a bare 2-character acupoint-name
    fragment with no surrounding sentence context, no qcDefectCategory field recorded in production.
  reviewNote: >-
    "中脘" (Zhongwan, CV12) is a real acupuncture point name; 中 reads "zhong" and 脘 reads "wan" -
    there is no character in this source that reads "xuan". currentTranslation's descriptive gloss
    "Upper Central Abdomen" is an acceptable, if unremarkable, plain-language rendering (the
    name-as-gloss pattern the prompt already discourages, but not incoherent or wrong). The
    proposedCorrection switches to transliteration, which is the right instinct for a proper
    acupoint name, but fabricates an incorrect romanization - "Zhongxuan" does not correspond to
    either character's actual pinyin reading. This is a genuine harmful correction: it replaces a
    merely-suboptimal gloss with a confidently wrong proper name that a player or later translator
    could mistake for the point's real name.
