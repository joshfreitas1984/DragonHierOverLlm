- raw: "对待仇敌,......若深仇大恨之人罹患重病......又是否应当救其性命......,与老夫为敌之人，唯有赶尽杀绝一途而已。,哼，若是有人敢与我结仇，\\n本姑娘非得把他裤头子都偷过来，方能一解心头之恨。,老夫平日隐居山林，鲜有好友，却也无甚仇敌。\\n至人无己，神人无功，圣人无名，如是而已。,#PlayerName#若敢阻碍我铁掌帮行事，\\n到时可休怪老夫不讲情面。,何人敢与老子为敌，老子定会叫他后悔终生！,明枪易躲，暗箭难防。\\n#PlayerName#行走江湖之时，还是少结些仇家为妙。,峨眉山中有个老猴王，天天撒泼捣乱，破坏田地，\\n实在是本姑娘一生之大敌！,恩怨如棋，不必争一时之得失......\\n唯有精心布局，笑到最后，方才称得上是赢家。,睚眦之怨，亦当百倍奉还。\\n若非如此，他人怎知我计心狂不好招惹？,为一己私仇驱使，只会徒增无谓的杀戮。\\n行走江湖，当以公道大义为重！,自古正邪不两立，惩奸除恶，斩妖伏魔，\\n此乃我武当正道应尽之职责。"
