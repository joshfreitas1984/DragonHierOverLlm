- raw: "日常见面,......#PlayerName#......近来可有受伤......,#PlayerName#，有何贵干？,#PlayerName#，最近可有得手什么好宝物？\\n......你这是什么表情，我、我可没想偷你东西。,天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。\\n便是老夫也算不出，这乱世究竟何时终结......,#PlayerName#前来寻我，想必是有事相求。,废话少说，#PlayerName#找老子所为何事？,呵呵呵呵，#PlayerName#今日前来拜访，老朽恐怕早已猜到了。,这世间有比山上野果更好吃的东西？我可不信！\\n除非#PlayerName#下次带来给我尝尝！,#PlayerName#今日看来颇有雅兴，\\n不然怎会突然想起前来寻我？,#PlayerName#就算有事相求，也得拿出相应价码交换才行。,在下不才，蒙武林同道厚爱，得了这“中原大侠”的名号。\\n每每想来，只觉诚惶诚恐，羞愧莫名。,#PlayerName#又见面了，看来你我也算缘分不浅。"
