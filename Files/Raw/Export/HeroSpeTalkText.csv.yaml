    text: "......你这是什么表情，我、我可没想偷你东西。"
  - split: 4
    text: "天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。"
  - split: 4
    subIndex: 1
    text: "便是老夫也算不出，这乱世究竟何时终结......"
  - split: 5
    text: "#PlayerName#前来寻我，想必是有事相求。"
  - split: 6
    text: "废话少说，#PlayerName#找老子所为何事？"
  - split: 7
    text: "呵呵呵呵，#PlayerName#今日前来拜访，老朽恐怕早已猜到了。"
  - split: 8
    text: "这世间有比山上野果更好吃的东西？我可不信！"
  - split: 8
    subIndex: 1
    text: "除非#PlayerName#下次带来给我尝尝！"
  - split: 9
    text: "#PlayerName#今日看来颇有雅兴，"
  - split: 9
    subIndex: 1
    text: "不然怎会突然想起前来寻我？"
  - split: 10
    text: "#PlayerName#就算有事相求，也得拿出相应价码交换才行。"
  - split: 11
    text: "在下不才，蒙武林同道厚爱，得了这“中原大侠”的名号。"
  - split: 11
    subIndex: 1
    text: "每每想来，只觉诚惶诚恐，羞愧莫名。"
  - split: 12
    text: "#PlayerName#又见面了，看来你我也算缘分不浅。"
