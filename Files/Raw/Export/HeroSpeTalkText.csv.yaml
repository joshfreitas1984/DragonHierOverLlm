- raw: "思考招式,......#PlayerName#......我此招使得......可有纰漏？,绝顶高手相争之时，唯一目的便是击败对方。\\n无欲无情，全心投入，专注于“杀”这一字便已足够。,#PlayerName#，你不会和那些无趣江湖人士一般，\\n成天只知道习武练功吧！,习武练功，何必拘泥于招式？\\n从心所欲，挥手成招，方为至高之境界。,#PlayerName#，老夫这铁掌帮武功，不知可在仙霞派之上？,老子所习招式，皆是逆势而动，倒转而行。\\n任你大罗金仙，也休想摸清老子的套路。,高手之争，非在一招一式之间，而在于运用之“人”身上。\\n只要时机得当，再弱的招式亦能威力倍增。,听师傅说，出招之法在于随心所欲，无拘无束。\\n若能一呼一吸，收发自然，便也算小半个高手了吧。,道无名阁主功力深不可测，我确实远远不及。\\n不过若论剑招之精妙，或许我能略胜一筹。,哼哼，见过我招式之人大多已经殒命，\\n#PlayerName#还是少好奇些为妙。,江湖偌大，在下远算不上天赋异禀。\\n但若论练功刻苦，恐怕无人能与我相提并论。,我道法修为尚浅，师傅总说我还不懂太极生两仪，两仪生四象，四象生八卦的道理。\\n我只见过母鸡生小鸡，却不知这太极生两仪究竟是怎么个“生”法。"
