  - split: 3
    text: "本姑娘一闲着没事，就想去偷点好东西......"
  - split: 3
    subIndex: 1
    text: "#PlayerName#要不要一起？"
  - split: 4
    text: "读万卷书，行万里路，方为修行之道。"
  - split: 4
    subIndex: 1
    text: "#PlayerName#闲暇之时，也当多读些经史典籍才是。"
  - split: 5
