- raw: "对待朋友,......我久居深山幽谷之中......像#PlayerName#这样能说上两句话之人......亦是不多......,天下之间，太多蝇营狗苟之辈。\\n人生一世，又能遇上几个倾心相交的英雄豪杰？,#PlayerName#放心，本姑娘一般不偷相熟之人的东西......\\n除非有人惹我不开心了！,君子之交，淡泊如水，\\n志同道合之谊，方能历久弥坚。,哼哼，#PlayerName#若能助铁掌帮一臂之力，\\n我夏天雄自也不会亏待阁下......,行走江湖，老子早已习惯了独来独往。\\n报团取暖，不过是蝼蚁所为。,这些年来，老朽见过太多亲朋反目，手足相残之惨剧。\\n所谓天下熙熙皆为利来，天下攘攘皆为利往，莫不如是。,我朋友大多是些飞禽走兽，山野猴子，\\n#PlayerName#你算第一个初具人形的......这成语是这么用的吧？,缘起相聚，缘散别离，江湖中人身若浮萍，\\n#PlayerName#与我也不过如是。,#PlayerName#若能助一臂之力，我自然不会亏待于你。,兄弟义气，自当肝胆相照，一片赤诚。\\n想必#PlayerName#也如此认为。,只要我等名门大派秉公持正，携手并进，\\n就定能使这天下武林风清气正，海晏河清。\\n不知#PlayerName#是否也这样认为？"
