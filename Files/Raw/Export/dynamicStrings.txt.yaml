    text: "他的事迹不断激励着资质平平者，勇敢踏上习武这条道路"
  templates:
  - template: "{0}\n{1}\n{2}\n{3}"
- raw: "师兄沈退日后与唐门一道，成为了仙霞派的情报总管。\n不论是奸邪宵小，还是阴谋诡计，都逃不过他的锐眼扫视。\n而他对待这些人毫不留情，不择手段，\n也使所有与仙霞派为敌者闻之色变。"
  splits:
  - text: "师兄沈退日后与唐门一道，成为了仙霞派的情报总管。"
  - subIndex: 1
    text: "不论是奸邪宵小，还是阴谋诡计，都逃不过他的锐眼扫视。"
  - subIndex: 2
    text: "而他对待这些人毫不留情，不择手段，"
  - subIndex: 3
    text: "也使所有与仙霞派为敌者闻之色变。"
  templates:
  - template: "{0}\n{1}\n{2}\n{3}"
- raw: "师兄顾游年继续充当着仙霞派的军师，替你出谋划策。\n以高超的计谋，斡旋各大门派之间的纷争。\n在他的纵横捭阖之下，仙霞派一直确保着江湖中的统治地位，\n始终未被任何门派撼动。"
  splits:
  - text: "师兄顾游年继续充当着仙霞派的军师，替你出谋划策。"
