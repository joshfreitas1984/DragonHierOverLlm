- raw: "（抡起铁锤向石板砸去）嚯！哈！嚯！哈！......\n这铁锤好生沉重，震的我筋酸骨麻，几下便将石板敲得粉碎。\n#SourceInteractName#你感觉如何，可需叫大夫前来救治？"
