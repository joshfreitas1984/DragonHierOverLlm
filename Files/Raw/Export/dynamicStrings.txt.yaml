- raw: "师叔"
  splits:
  - text: "师叔"
- raw: "师妹林云裳，成为了派内各种杂务之总管。\n偌大的门派在她的细心打理之下井井有条。\n她的厨艺也愈发精进，\n使仙霞派食堂，成为了巴蜀一带远近闻名的美食圣地。"
  splits:
  - text: "师妹林云裳，成为了派内各种杂务之总管。"
  - subIndex: 1
    text: "偌大的门派在她的细心打理之下井井有条。"
  - subIndex: 2
    text: "她的厨艺也愈发精进，"
  - subIndex: 3
    text: "使仙霞派食堂，成为了巴蜀一带远近闻名的美食圣地。"
  templates:
  - template: "{0}\n{1}\n{2}\n{3}"
- raw: "师姐余采薇继续醉心习武，并逐步成为了仙霞派最为锐利之宝剑。\n在她锋芒所指之处，群邪避易，妖魔退散，\n最终她成为了江湖中人人敬仰之女剑侠，\n并在英雄谱上留下了自己的痕迹。"
  splits:
  - text: "师姐余采薇继续醉心习武，并逐步成为了仙霞派最为锐利之宝剑。"
  - subIndex: 1
    text: "在她锋芒所指之处，群邪避易，妖魔退散，"
  - subIndex: 2
    text: "最终她成为了江湖中人人敬仰之女剑侠，"
  - subIndex: 3
    text: "并在英雄谱上留下了自己的痕迹。"
  templates:
  - template: "{0}\n{1}\n{2}\n{3}"
- raw: "师姐你蕙质兰心，温柔善良，怎么会为难小辈呢？\n今天你就放我下山吧！我保证不乱跑。"
  splits:
  - text: "师姐你蕙质兰心，温柔善良，怎么会为难小辈呢？"
  - subIndex: 1
    text: "今天你就放我下山吧！我保证不乱跑。"
  templates:
  - template: "{0}\n{1}"
- raw: "师姐姜婉以先皇公主的身份，帮仙霞派沟通朝廷，号令群雄。\n在她的斡旋之下，仙霞派威望日隆，在朝中支持者也越来越多。\n仙霞派也借助她的身份，在朝堂中扮演着举足轻重的角色。"
