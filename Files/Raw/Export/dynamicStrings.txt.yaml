  - text: "师姐余采薇继续醉心习武，并逐步成为了仙霞派最为锐利之宝剑。"
  - subIndex: 1
    text: "在她锋芒所指之处，群邪避易，妖魔退散，"
  - subIndex: 2
    text: "最终她成为了江湖中人人敬仰之女剑侠，"
  - subIndex: 3
    text: "并在英雄谱上留下了自己的痕迹。"
  templates:
  - template: "{0}\n{1}\n{2}\n{3}"
- raw: "师姐姜婉以先皇公主的身份，帮仙霞派沟通朝廷，号令群雄。\n在她的斡旋之下，仙霞派威望日隆，在朝中支持者也越来越多。\n仙霞派也借助她的身份，在朝堂中扮演着举足轻重的角色。"
  splits:
  - text: "师姐姜婉以先皇公主的身份，帮仙霞派沟通朝廷，号令群雄。"
  - subIndex: 1
    text: "在她的斡旋之下，仙霞派威望日隆，在朝中支持者也越来越多。"
  - subIndex: 2
    text: "仙霞派也借助她的身份，在朝堂中扮演着举足轻重的角色。"
  templates:
  - template: "{0}\n{1}\n{2}"
- raw: "师弟们还在长身体的时候，多吃点又有什么大碍。\n尝尝师姐今年做的枣泥月饼，味道也是不错。"
  splits:
  - text: "师弟们还在长身体的时候，多吃点又有什么大碍。"
  - subIndex: 1
    text: "尝尝师姐今年做的枣泥月饼，味道也是不错。"
