- raw: "12月初8乃释迦摩尼悟道成佛之日，家家户户会以各种谷物豆类，混合红枣花生莲子枸杞桂圆核桃等干果，佐以红糖白糖熬煮成一锅香甜浓郁的腊八粥以表纪念。"
  splits:
  - text: "12月初8乃释迦摩尼悟道成佛之日，家家户户会以各种谷物豆类，混合红枣花生莲子枸杞桂圆核桃等干果，佐以红糖白糖熬煮成一锅香甜浓郁的腊八粥以表纪念。"
- raw: "1月15日乃是一年中首个月圆之夜，各大城市皆会张灯结彩，举办赏花灯、猜灯谜、吃汤圆、舞鱼龙等活动。"
  splits:
  - text: "1月15日乃是一年中首个月圆之夜，各大城市皆会张灯结彩，举办赏花灯、猜灯谜、吃汤圆、舞鱼龙等活动。"
- raw: "3月上旬清明节既是节气，又是节日。正值春季气清景明，万物萌发，生机勃勃，也是民众扫墓祭祖，追怀先人的节日。"
  splits:
  - text: "3月上旬清明节既是节气，又是节日。正值春季气清景明，万物萌发，生机勃勃，也是民众扫墓祭祖，追怀先人的节日。"
- raw: "7月初7传说是牛郎织女鹊桥相会之日，因此也是探访心仪之人的浪漫节日。各大城镇也会举办穿针乞巧，拜祭织女等活动以示庆祝。"
