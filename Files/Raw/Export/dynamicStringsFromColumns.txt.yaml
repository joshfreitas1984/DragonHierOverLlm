- raw: "#PlayerName#一席话令我醍醐灌顶，人在江湖，身不由己，金盆洗手，谈何容易？\n在此乱世之中，并无真正避世绝俗，可享永世清净的隐居之所。\n我已打消退隐江湖的念头了，多谢#PlayerName#提点！"
