- raw: 莫要辜负了唐掌门一片好心。
  rawSimplified: 莫要辜负了唐掌门一片好心。
  rawTraditional: 莫要辜負了唐掌門一片好心。
  result: Do not disappoint Sect Leader Tang's good intentions.
  direct: Do not let down Sect Leader Tang's kind intentions.
- raw: 待京城风波彻底平息后，
  rawSimplified: 待京城风波彻底平息后，
  rawTraditional: 待京城風波徹底平息後，
  result: Once the turmoil in the capital has completely subsided,
  direct: After the disturbances in the capital have completely calmed down,
