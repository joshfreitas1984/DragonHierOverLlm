- raw: 哈哈哈，妹儿放心，大哥我自然早有防备。
  rawSimplified: 哈哈哈，妹儿放心，大哥我自然早有防备。
  rawTraditional: 哈哈哈，妹兒放心，大哥我自然早有防備。
  result: Hahaha, don't worry, sis. Big brother naturally came prepared.
  direct: Hahaha, little sister, don't worry. Your big brother naturally made preparations long ago.
- raw: 呵呵，咱们大师兄就算变成厉鬼，也是去找铁掌帮索命啊，
  rawSimplified: 呵呵，咱们大师兄就算变成厉鬼，也是去找铁掌帮索命啊，
  rawTraditional: 呵呵，咱們大師兄就算變成厲鬼，也是去找鐵掌幫索命啊，
  result: Heh, even if our big senior brother became a vengeful ghost, he'd go after the Iron Palm Gang to claim their lives.
  direct: Hehe, even if our eldest senior brother turned into a vengeful ghost, he'd still go to the Iron Palm Gang to demand their lives.
- raw: 哈哈哈哈，王寨主，兄弟来迟一步，莫要见怪。
  rawSimplified: 哈哈哈哈，王寨主，兄弟来迟一步，莫要见怪。
  rawTraditional: 哈哈哈哈，王寨主，兄弟來遲一步，莫要見怪。
  result: Hahahaha, Fort Master Wang, forgive your brother for arriving a little late.
  direct: Hahahaha, Village Chief Wang, your brother arrived one step late; please don't take offense.
- raw: 好！余师姐，今天不练会，我杨思迟就不睡觉了！
  rawSimplified: 好！余师姐，今天不练会，我杨思迟就不睡觉了！
  rawTraditional: 好！余師姐，今天不練會，我楊思遲就不睡覺了！
  result: Good! Senior Sister Yu, if I don't master this today, I, Yang Sichi, won't sleep!
  direct: Good! Senior Sister Yu, if I don't practice this today, I, Yang Sichi, won't go to sleep!
- raw: 本大侠手中这剑可不是摆设，姑娘，告辞！
  rawSimplified: 本大侠手中这剑可不是摆设，姑娘，告辞！
  rawTraditional: 本大俠手中這劍可不是擺設，姑娘，告辭！
  result: The sword in this great hero's hand is no mere decoration. Miss, farewell!
  direct: The sword in this hero's hand is certainly not a mere ornament. Miss, I bid you farewell!
