  result: Wu Jueyi's unique martial art combines the Flying Dragon Gate's Imperial Fengshan Technique with the Kongtong Sect's Stars Shift and Stars Turn. Its attacks and internal energy circulation completely defy conventional principles, making it strange and unpredictable. Practitioners who are even slightly careless may suffer qi deviation and become possessed by inner demons.
