    modelPreset: HyMT2Moe
    modelPresetType: Standard
    model: "hf.co/mradermacher/Hy-MT2-30B-A3B-i1-GGUF:i1-IQ3_XXS"
glossaryPreset:
  usePresetChineseGlossary: true
  chineseGlossaryTypesToSupress:
    - Phonetics
useContinuousWorkerPool: true
maxConcurrency: 2
retryCount: 3
# escalationModelName: Qwen25-Standard
# escalationRetryCount: 1
batchSize: 100
skipLineValidation: false
correctionPromptsEnabled: true
translateFlagged: true
qualityReview:
  enabled: true
  # Single model for every QC role (detection/verification/correction/repair) - see
  # docs/investigations/tests/qc-evaluator-model-selection.md for why, and why a faster/cheaper
  # corrector model was tried and rejected.
  modelName: Qwen38Qc-IQ4XS
  minAcceptableScore: 60
  maxConcurrency: 2
  inlineRuleCheckRetries: 2
  autoAcceptDefectCategories: [HardToParseSeam, OtherNamedDefect, DroppedContent, DroppedStutter]
translationAssessment:
  enabled: true
  modelNames:
    - Qwen25-Standard
    - HyMT2-7B
    - HyMT2-30B-A3B
