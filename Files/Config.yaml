qualityEvaluatorAssessment:
  enabled: true
  # Narrowed 2026-09-20 per docs/plans/qc-evaluator-comparison.md's "Active Candidate Set" -
  # QwenQc-14B, HyMT2-7B, and HyMT2-30B-A3B-Q3 dropped (no pickup from the prompt fix, or a
  # standalone bug).
  # HyMT2-30B-A3B and HyMT2-30B-A3B-Q3XXS dropped from routine rounds 2026-09-20 (final, after
  # two independent verified prompt-tuning rounds each showed a real capability ceiling on
  # semantic-reasoning defect categories, not a wording problem - see the plan doc's Status
  # "Fourth round" entry). Their `models:` definitions above stay in place; they're the building
  # blocks for the not-yet-built doubled-detection/fast-corrector process variants, which need
  # their own purpose-built assessment, not a slot in this standalone-candidate comparison.
  # Qwen38Qc-IQ4XS added 2026-09-20 - Qwen38Qc itself is a Q3_K_XL quant, not full weight, so this
  # tests whether a higher-precision quant of the SAME accuracy-benchmark model recovers
  # recall/precision the current default quant might be leaving on the table.
  # Qwen38Qc-UDQ4KM added 2026-09-20 - Unsloth Dynamic method beat a same-size plain q4_K_M quant
  # outright (that plain-quant entry, Qwen38Qc-Q4KM, was removed from `models:` above once ruled
  # out) - see the plan doc's Status "Fifth round". This 16.3GB-VRAM card's zero-CPU-spill ceiling
  # sits right around Qwen38Qc's 14.08GB, so Q3-Q4 is the realistic operating band on this hardware
  # - not pursuing Q5+.
  # PAUSED 2026-09-20: quant selection is deliberately on hold pending prompt-maxing (see the plan
  # doc's "Next Steps" - prompt fixes generalize across quants, quant comparisons do not survive
  # prompt changes, so tune the prompt first on the fastest quant, then do one final quant sweep).
  modelNames:
    - Qwen38Qc
    # Qwen38Qc-IQ4XS and Qwen38Qc-UDQ4KM temporarily commented out 2026-09-20 for a
    # terminology-glossary-fix verification run scoped to the fastest quant only, per the
    # "Next Steps" prompt-max-first ordering. Restore both before any future quant-comparison run.
    # - Qwen38Qc-IQ4XS
    # - Qwen38Qc-UDQ4KM
  goldSetPath: Goldset/GoldSet.yaml
  outputPath: TestResults/QcEvaluatorAssessment