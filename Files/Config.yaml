    modelPreset: Qwen25
    modelPresetType: StructuredText
    customPromptsPath:
    apiKeyPath:
    model: qwen2.5:14b-instruct
  - name: QwenQc-14B
    modelPreset: Qwen25
    modelPresetType: Standard
    model: qwen2.5:14b-instruct
  - name: Qwen38Qc
    modelPreset: Qwen38
    modelPresetType: Standard
  - name: Qwen38Qc-IQ4XS
    modelPreset: Qwen38
    modelPresetType: Standard
    model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ4_XS"
  - name: Qwen38Qc-UDQ4KM
    modelPreset: Qwen38
    modelPresetType: Standard
    model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M"
  - name: HyMT2-30B-A3B
    modelPreset: HyMT2Moe
