models:
  - name: Qwen25-Standard
    modelPreset: Qwen25 
    modelPresetType: Standard
    customPromptsPath: 
    apiKeyPath: 
    model: qwen2.5:14b-instruct
  - name: Qwen25-StructuredText
    modelPreset:  Qwen25
    modelPresetType: StructuredText
    customPromptsPath:
    apiKeyPath:
    model: qwen2.5:14b-instruct
  # Quality-review-pass candidate models (see docs/plans/quality-review-pass.md). Each uses its own
  # model-family preset (Qwen25/Glm4) purely for its BaseQualityReviewPrompt - different model
  # families can need differently-tuned QC prompt wording (same reason BaseSystemPrompt.txt is
  # already family-specific for translation), so this is NOT a shared/generic prompt - see
  # BaseFiles/Qwen25/Prompts/BaseQualityReviewPrompt.txt vs BaseFiles/Glm4/Prompts/BaseQualityReviewPrompt.txt
  # in FanslationStudio.LlmKit. `model:` overrides the preset's own default model string (Qwen25's
  # preset defaults to qwen2.5:7b - the translation model - so it must be overridden here to the
  # larger QC-only model). Neither model is used unless qualityReview.enabled is true and
  # qualityReview.modelName points at one of them - pull both (`ollama pull qwen2.5:14b-instruct` /
  # `ollama pull glm4:9b`) and run the sample-comparison step from the plan before committing to
  # one for a full run.
  - name: QwenQc-14B
    modelPreset: Qwen25
    modelPresetType: Standard
    model: qwen2.5:14b-instruct
  - name: Glm4Qc-9B
    modelPreset: Glm4
    modelPresetType: Standard
  - name: Qwen38Qc
    modelPreset: Qwen38
    modelPresetType: Standard
glossaryPreset:
  usePresetChineseGlossary: true
  chineseGlossaryTypesToSupress:
    - Phonetics
useContinuousWorkerPool: true
maxConcurrency: 2 # Ollama is capped anyway - tests show lower is faster on bigger models
retryCount: 3 # Dropped from 3 - no stronger model to escalate to, so extra retries mostly just burn time on the same qwen2.5:7b model
# Escalation: once a split exhausts `retryCount` against its normal model and is still invalid, it
# gets escalationRetryCount extra attempts against the model named here (must match a `name` under
# `models:` above). No-op if unset, or if it resolves to the exact same underlying model (`Model`
# string) as the split already tried - so this is safe to leave pointed at the same Qwen2.5 entry
# for now; swap it to a real second/stronger model under `models:` later with no other code
# changes needed.
# escalationModelName: Qwen25-Standard
# escalationRetryCount: 1
batchSize: 100
skipLineValidation: false
correctionPromptsEnabled: true
translateFlagged: true
# Post-translation quality review pass (see docs/plans/quality-review-pass.md and
# ../../FanslationStudio.LlmKit/docs/quality-review-pass-architecture.md). Disabled by default - a
# documented no-op until you're ready to run it (QualityReviewWorkflow.RunAsync just logs and
# returns when enabled: false). Run the "3b. RunQualityReviewPass" test fact manually, never as
# part of a batch - same rule as every other numbered workflow step in this repo.
#
# `enabled` also gates PACKAGING, not just the QC pass itself: when false, every packaging path
# ignores any already-stored QcTranslated/QcQualityScore (via QualityReviewHelpers.IsQcReviewFresh)
# and packages the plain pre-QC Translated text instead - minAcceptableScore/
# autoAcceptDefectCategories below are never consulted. Safe to flip and re-run packaging only, no
# LLM calls needed - nothing in Files/Converted is touched, so re-enabling restores the QC-corrected
# output exactly as it was. Useful for isolating "did a QC correction cause this" from "was it
# already broken before QC touched it" - see
# Tests/docs/qc-run-startup-crash-investigation-2026-09-15.md for a worked example.
qualityReview:
  enabled: true
  modelName: Qwen38Qc #QwenQc-14B #Glm4Qc-9B
  minAcceptableScore: 60 # tune freely and re-run packaging only - no LLM calls needed to see the effect
  maxConcurrency: 2 # falls back to maxConcurrency above, then batchSize, then 20. Lower is faster on big models
  inlineRuleCheckRetries: 2 # extra in-call retries when a correction hits the bad-words list, before falling back to the cross-run QcRuleCheckFailureCount retry
  # DEFECT categories hand-validated (Tests/docs/qc-qualityscore-noise-investigation.md) as near-0%
  # precision on a 40-line sample each (QcTriageByDefectCategory.yaml) - trust QcTranslated wholesale
  # despite a low score instead of holding these back for human review. LostIdiom deliberately left
  # off: low precision too, but at least one hand-checked correction made a fine idiom worse instead
  # of fixing a real defect, a different risk than "wastes review time". GarbledNumber/DomainTerm/
  # UntranslatedPinyin also left off - high precision, worth the human review queue. DroppedStutter
  # added after re-triaging under twoStageVerificationEnabled: a ~36-line spot-check came back clean
  # (0 bad fixes), a marked improvement over the ~65%-genuine/8-bad-fixes finding under single-stage
  # verification that originally kept it in the review queue - but the sample is still small next to
  # the old 137-line full-population check, so revisit with a larger sample if this category's flagged
  # count grows a lot or a bad fix turns up again.
  autoAcceptDefectCategories: [HardToParseSeam, OtherNamedDefect, DroppedContent, DroppedStutter]
  # Second, narrower LLM call for any column flagged with a named DEFECT: confirms/rejects (raising
  # the score back up on a false positive)/recategorizes the claim, and only its own scoped
  # correction is ever accepted - never call 1's freehand rewrite. See
  # Tests/docs/qc-qualityscore-noise-investigation.md's "Two-stage DEFECT verification" section.
  twoStageVerificationEnabled: true
