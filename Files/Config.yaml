    modelPreset: HyMT2
    modelPresetType: Standard
  - name: Qwen25-Standard
    modelPreset: Qwen25
    modelPresetType: Standard
    customPromptsPath:
    apiKeyPath:
    model: qwen2.5:14b-instruct
