models:
  - name: Qwen25-Standard
    modelPreset: Qwen25 
    modelPresetType: Standard
    customPromptsPath: 
    apiKeyPath: 
    model: qwen2.5:14b-instruct
  - name: Qwen25-StructuredText
    modelPreset:  Qwen25
    modelPresetType: StructuredText
    customPromptsPath:
    apiKeyPath:
    model: qwen2.5:14b-instruct
  - name: QwenQc-14B
    modelPreset: Qwen25
    modelPresetType: Standard
    model: qwen2.5:14b-instruct
  - name: Qwen38Qc
    modelPreset: Qwen38
    modelPresetType: Standard
    # Uses FanslationStudio.LlmKit's BaseFiles/Qwen38/Config.yaml default model:
    # hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q3_K_XL - i.e. this "benchmark" model is itself a Q3 quant,
    # not full weight. The two entries below are quant-comparison siblings, added 2026-09-20.
  - name: Qwen38Qc-IQ4XS
    modelPreset: Qwen38
    modelPresetType: Standard
    model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ4_XS"
    # Qwen38Qc-Q4KM (plain qwen3.8:27b-q4_K_M) removed 2026-09-20 - ruled out: UD-Q4_K_M below
    # beat it outright at the same size/latency (+0.224 precision, false positives 10 -> 4). See
    # docs/plans/qc-evaluator-comparison.md Status "Fifth round".
  - name: Qwen38Qc-UDQ4KM
    modelPreset: Qwen38
    modelPresetType: Standard
    model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M"
  - name: HyMT2-30B-A3B
    modelPreset: HyMT2Moe
    modelPresetType: Standard
  - name: HyMT2-7B
    modelPreset: HyMT2
    modelPresetType: Standard
  - name: HyMT2-30B-A3B-Q3
    modelPreset: HyMT2Moe
    modelPresetType: Standard
    model: "hf.co/mradermacher/Hy-MT2-30B-A3B-i1-GGUF:i1-IQ3_XS"
  - name: HyMT2-30B-A3B-Q3XXS
    modelPreset: HyMT2Moe
    modelPresetType: Standard
    model: "hf.co/mradermacher/Hy-MT2-30B-A3B-i1-GGUF:i1-IQ3_XXS"
glossaryPreset:
  usePresetChineseGlossary: true
  chineseGlossaryTypesToSupress:
    - Phonetics
useContinuousWorkerPool: true
maxConcurrency: 2
retryCount: 3
# escalationModelName: Qwen25-Standard
# escalationRetryCount: 1
batchSize: 100
skipLineValidation: false
correctionPromptsEnabled: true
translateFlagged: true
qualityReview:
  enabled: true
  modelName: Qwen38Qc #QwenQc-14B #Glm4Qc-9B
  minAcceptableScore: 60
  maxConcurrency: 2
  inlineRuleCheckRetries: 2
  autoAcceptDefectCategories: [HardToParseSeam, OtherNamedDefect, DroppedContent, DroppedStutter]
translationAssessment:
  enabled: true
  modelNames:
    - Qwen25-Standard
