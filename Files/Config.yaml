# Model choices and the investigation behind them: docs/investigations/tests/qc-evaluator-model-selection.md
# (QC model/quant/process-shape decision) and docs/plans/translation-prompt-tuning-candidates.md
# (translation-model comparison). The FIRST entry in this list is the main translator model
# (see FanslationStudio.LlmKit's LlmHelpers.CalculateModelConfig).
